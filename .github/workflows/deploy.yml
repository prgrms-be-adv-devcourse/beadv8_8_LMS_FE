# main → 운영(prod), dev → 개발 서버(dev)로 배포한다. ci.yml이 통과해야 배포 단계로 넘어간다.
# 이미지를 GHCR에 올린 뒤, 배포 전용 SSH 키로 EC2의 deploy.sh를 실행한다. 서버에서는 web 컨테이너만 교체된다.
# 서버 쪽 구성(compose, edge nginx, deploy.sh)은 BE 레포 docker/에 있다.
# 필요한 Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
name: Deploy

on:
  push:
    branches: [main, dev]

# 같은 브랜치의 배포는 순서대로 실행한다.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_fe

jobs:
  # 테스트를 통과한 커밋만 배포한다(ci.yml 재사용).
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 배포 대상 결정
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"; echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"; echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest|:dev는 배포용, :sha-<커밋>은 롤백용(서버 env에 FE_TAG로 고정)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # 서버·Secrets 준비 전에는 이미지 push까지만 하고 배포는 건너뛴다.
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOST Secret이 없어 EC2 배포를 건너뜁니다."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "${{ steps.target.outputs.env }} web"
