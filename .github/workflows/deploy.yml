# 운영(prod) k3s FE 배포·롤백. Actions → Deploy → Run workflow(브랜치 main)에서 수동으로 실행한다.
# 이미지는 main push 때 publish.yml이 :sha-<커밋>으로 올린다. 이 workflow는 이미지를 만들지 않는다.
# - sha: 배포할 main 커밋. 비우면 main 최신이다. 롤백도 되돌릴 main 커밋을 넣고 실행한다.
# web Deployment·Service·HTTPRoute·NetworkPolicy(k8s/overlays/prod)만 적용한다. 공용 Gateway·BE 앱·DB는 건드리지 않는다.
# rollout이 실패하면 Deployment만 이전 revision으로 되돌리고 실패로 끝난다(.github/scripts/k3s-deploy.sh).
#
# 클러스터 접근: GitHub OIDC로 IAM role을 받아 SSM Run Command로 large에서 kubectl을 실행한다(6443·SSH를 쓰지 않는다. BE와 같은 방식).
#   role의 trust는 이 레포 environment prod job만 허용하고, prod environment는 main 브랜치만 허용한다.
#   prod environment Secrets: AWS_DEPLOY_ROLE_ARN(role ARN), DEPLOY_INSTANCE_ID(large 인스턴스 ID)
# GHCR은 조직 정책으로 private이다. 이 job의 GHCR 로그인(GITHUB_TOKEN)은 러너에서 이미지가 있는지 보는 데만 쓴다.
#   node는 hapbang-prod의 공유 Secret ghcr-pull(BE 레포 k8s/registry, 90일 PAT)로 받는다. 토큰을 서버로 보내지 않는다(TKT-460).
# 공개 레포라 로그도 공개다. node 이름·IP가 나오는 출력을 하지 않는다.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 main 커밋 sha(7~40자). 비우면 main 최신
        type: string
        required: false

# 운영 배포는 한 번에 하나씩 순서대로 실행한다.
concurrency:
  group: deploy-k3s-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_fe

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 30
    permissions:
      contents: read
      # 러너에서 이미지가 GHCR에 있는지 확인한다(node의 pull 인증과 별개).
      packages: read
      # GitHub OIDC 토큰으로 AWS role을 받는다.
      id-token: write
    steps:
      # 입력값은 스크립트에 직접 넣지 않고 환경 변수로만 받는다(명령 주입 방지).
      - name: 입력 확인
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::main 브랜치에서 실행하세요(Run workflow → Use workflow from: main). 현재: $GITHUB_REF"
            exit 1
          fi
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::sha는 소문자 16진수 7~40자여야 합니다."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 커밋 확인
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify --quiet "${INPUT_SHA:-HEAD}^{commit}") || {
            echo "::error::커밋을 찾을 수 없거나 짧은 sha가 여러 커밋에 해당합니다: $INPUT_SHA"
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::main에 포함되지 않은 커밋입니다: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 테스트를 통과한 main 커밋에만 이미지가 있다.
      - name: 이미지 확인
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:sha-$SHA" > /dev/null; then
            echo "::error::이미지 $IMAGE:sha-$SHA 가 없습니다. 그 커밋의 Publish image run이 실패했거나 아직 진행 중입니다."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 배포
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          before=$(.github/scripts/ssm-run.sh .github/scripts/k3s-deploy.sh image)
          {
            echo "### 운영 배포"
            echo "- 커밋: \`$SHA\` $(git log -1 --format=%s "$SHA")"
            echo "- 이전 이미지: \`${before:-없음}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/ssm-run.sh .github/scripts/k3s-deploy.sh apply "$SHA" < /dev/null
