# main push 때 테스트를 통과한 커밋으로 이미지를 만들어 GHCR에 올린다. 배포는 하지 않는다(deploy.yml을 수동 실행).
# 태그는 :sha-<커밋> 하나다. :latest 같은 움직이는 태그는 만들지 않는다. dev push는 CI만 돈다(dev 서버 없음).
# GHCR 패키지는 조직 정책으로 private이다. k3s는 hapbang-prod의 공유 Secret ghcr-pull(BE 레포 k8s/registry)로 받는다. 번들에는 공개 값만 넣는다.
# 필요한 Variables: TOSS_PAYMENTS_CLIENT_KEY(토스페이먼츠 테스트 클라이언트 키, 공개 값. 없으면 HP 충전이 꺼진다)
name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_fe

jobs:
  # 테스트를 통과한 커밋만 발행한다(ci.yml 재사용).
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_LOCAL_LOGIN은 넘기지 않는다(운영에는 local-login API가 없다). docs/deploy.md 환경변수 절 참고
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            VITE_TOSS_PAYMENTS_CLIENT_KEY=${{ vars.TOSS_PAYMENTS_CLIENT_KEY }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
