server {
    listen 80;
    root /usr/share/nginx/html;

    # 파일명에 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 없는 경로는 index.html로 보내 클라이언트 라우터가 처리한다.
    # index.html은 배포 직후 새 버전을 받도록 캐시하지 않는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
