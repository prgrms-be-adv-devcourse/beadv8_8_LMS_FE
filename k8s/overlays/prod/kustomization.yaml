# EC2 k3s prod. 배포 스크립트(.github/scripts/k3s-deploy.sh)가 이 overlay를 감싸 이미지 web을 GHCR의 :sha-<커밋>으로 바꿔 적용한다.
# 이미지 이름은 여기서 바꾸지 않는다. 바꾸면 감싸는 쪽 images의 name: web이 매치되지 않아 태그가 빠진다.
# GHCR은 조직 정책으로 private이다. pull Secret(ghcr-pull)은 배포 스크립트가 배포 동안만 만들고 지운다(장기 토큰을 두지 않는다).
# Secret이 없을 때 pod가 다시 떠도 노드에 이미지가 있으면 그대로 뜬다(imagePullPolicy IfNotPresent, 태그가 :sha-<커밋>).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
