# EC2 k3s prod. 배포 스크립트(.github/scripts/k3s-deploy.sh)가 이 overlay를 감싸 이미지 web을 GHCR의 :sha-<커밋>으로 바꿔 적용한다.
# 이미지 이름은 여기서 바꾸지 않는다. 바꾸면 감싸는 쪽 images의 name: web이 매치되지 않아 태그가 빠진다.
# GHCR은 조직 정책으로 private이다. hapbang-prod의 공유 Secret ghcr-pull(BE 레포 k8s/registry)로 받는다(TKT-460).
# FE 배포는 이 Secret을 만들거나 지우지 않는다. k8s 1.35부터 kubelet이 node에 있는 이미지도 pull 인증을 확인하므로 Secret을 계속 둔다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
