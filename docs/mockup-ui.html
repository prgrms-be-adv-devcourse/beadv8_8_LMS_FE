/* 충전 결과: 결제창에서 돌아온 뒤 서버가 PG 승인을 확인하는 단계(processing)를 거쳐 결과를 보여 줌 */
function ChargeResultScreen({ amount = 30000, result = 'success', stage }) {
  const { wallet, setWallet, addLedger, cart, go, openModal } = useApp();
  const [phase, setPhase] = useState(result === 'success' ? (stage || 'processing') : result);
  const applied = useRef(false);
  useEffect(() => {
    if (phase !== 'processing' || stage === 'processing') return;
    const t = setTimeout(() => setPhase('success'), 1400);
    return () => clearTimeout(t);
  }, [phase]);
  useEffect(() => {
    if (phase !== 'success' || applied.current) return;
    applied.current = true;
    setWallet(w => ({ ...w, charge: w.charge + amount }));
    addLedger([{ desc: 'HP 충전 · 토스페이먼츠', type: '충전', kind: 'charge', amt: amount }]);
  }, [phase]);
  const order = `HB-${TODAY.replace(/-/g, '')}-0042`;
  const V = {
    processing: { ico: '', tone: 'wait', title: '결제를 확인하고 있어요', text: '토스페이먼츠에 결제 승인을 요청했어요. 몇 초면 끝나요. 이 화면을 닫지 마세요.' },
    success: { ico: '✓', tone: 'ok', title: `${fmt(amount)} HP를 충전했어요`, text: '바로 강의를 사거나 출연료로 쓸 수 있어요.' },
    fail: { ico: '!', tone: 'bad', title: '결제가 승인되지 않았어요', text: '카드사에서 결제를 거절했어요 (테스트: 한도 초과). HP는 충전되지 않았고 결제 금액도 청구되지 않아요.' },
    cancel: { ico: '×', tone: 'mute', title: '결제를 취소했어요', text: '결제창을 닫아 충전하지 않았어요. 결제 금액은 청구되지 않아요.' },
  }[phase];
  return html`
    <div className="page narrow">
      <section className="panel result">
        <span className=${'result-ico ' + V.tone} aria-hidden="true">${phase === 'processing' ? html`<span className="spinner"></span>` : V.ico}</span>
        <h1>${V.title}</h1>
        <p className="lede">${V.text}</p>
        <div className="breakdown" style=${{ width: '100%' }}>
          <div className="row sub"><span>결제 금액</span><span className="num">${fmt(amount)}원</span></div>
          <div className="row sub"><span>결제 수단</span><span>토스페이먼츠 (테스트)</span></div>
          <div className="row sub"><span>주문 번호</span><span className="num">${order}</span></div>
          ${phase === 'success' && html`<div className="row total"><span>보유 HP</span><b className="num">${fmt(wallet.charge + wallet.earn)} HP</b></div>`}
          ${phase === 'fail' && html`<div className="row sub"><span>실패 코드</span><span className="num">REJECT_CARD_PAYMENT</span></div>`}
        </div>
        ${phase !== 'processing' && html`<div className="result-actions">
          ${phase === 'success' ? html`
            ${cart.length > 0 && html`<button className="btn primary" onClick=${() => go('cart')}>장바구니로</button>`}
            <button className=${'btn' + (cart.length ? '' : ' primary')} onClick=${() => go('wallet')}>지갑으로</button>`
          : html`
            <button className="btn primary" onClick=${() => openModal('charge', { preset: amount })}>다시 결제하기</button>
            <button className="btn" onClick=${() => go('wallet')}>지갑으로</button>`}
        </div>`}
      </section>
      <p className="fine" style=${{ textAlign: 'center' }}>테스트 결제라 실제 금액은 청구되지 않아요.</p>
    </div>`;
}

function ExchangeModal({ onClose }) {
  const { wallet, setWallet, addLedger, setExchanges, account, go, toast } = useApp();
  const [v, setV] = useState(String(Math.floor(wallet.earn / 1000) * 1000));
  const n = Number(v) || 0;
  const st = nextSettlement(TODAY);
  const err = n < 1000 ? '1,000 HP 이상부터 환전할 수 있어요.' : n % 1000 ? '1,000 HP 단위로 입력해 주세요.' : n > wallet.earn ? `환전할 수 있는 HP(${fmt(wallet.earn)})를 넘었어요.` : null;
  const f = fee10(n);
  return html`
    <${Modal} title="환전 신청" onClose=${onClose} footer=${html`
      <button className="btn ghost" onClick=${onClose}>취소</button>
      ${account ? html`<button className="btn primary" disabled=${!!err} onClick=${() => {
        setWallet(w => ({ ...w, earn: w.earn - n, exch: w.exch + n }));
        addLedger([{ desc: `환전 신청 · ${toD(st.pay).getMonth() + 1}월 정산`, type: '환전 신청', kind: 'earn', amt: -n }]);
        setExchanges(x => [{ id: uid(), at: md(TODAY), amt: n, fee: f, pay: st.pay }, ...x]);
        onClose(); toast(`환전을 신청했어요. ${mdw(st.pay)}에 송금돼요.`);
      }}>환전 신청</button>` : html`<button className="btn primary" onClick=${() => go('account')}>계좌 등록하기</button>`}`}>
      ${!account && html`<div className="notice warn">환전한 금액을 받을 계좌가 없어요. 본인 명의 계좌를 먼저 등록해 주세요.</div>`}
      <${Field} id="ex-amt" label="환전할 HP" err=${err} hint=${`환전 가능 ${fmt(wallet.earn)} HP (출연료·강의 판매로 받은 HP) · 1,000 HP 단위`}><input id="ex-amt" className="input num" inputMode="numeric" value=${v} onChange=${e => setV(e.target.value.replace(/\D/g, ''))} /><//>
      <div className="breakdown">
        <div className="row sub"><span>신청 HP</span><span className="num">${fmt(n)}</span></div>
        <div className="row sub"><span>플랫폼 수수료 10% (원 미만 버림)</span><span className="num">−${fmt(f)}</span></div>
        <div className="row total"><span>송금액</span><b className="num">${fmt(n - f)}원</b></div>
      </div>
      <dl className="kv">
        <dt>받을 계좌</dt><dd>${account ? html`${account.bank} ****${account.last4} · ${account.holder} <button className="link" style=${{ marginLeft: 6, fontSize: 13 }} onClick=${() => go('account')}>변경</button>` : html`<span className="c-bad">등록된 계좌 없음</span>`}</dd>
        <dt>송금일</dt><dd>${mdw(st.pay)} 정산일 자동 송금</dd>
      </dl>
      <p className="fine">신청한 HP는 바로 보류돼서 송금 전까지 결제에 쓸 수 없어요. 송금에 실패하면 다시 쓸 수 있게 돌려놔요.</p>
    <//>`;
}

/* 환전 계좌: 계좌 실명 확인 API로 회원 실명과 예금주가 같은지 확인한 뒤 등록 */
const BANKS = ['국민은행', '신한은행', '우리은행', '하나은행', 'NH농협은행', 'IBK기업은행', '카카오뱅크', '토스뱅크'];
const REAL_NAME = '김하늘';
const maskName = s => s[0] + '*' + s.slice(2);
function AccountScreen() {
  const { account, setAccount, go, toast } = useApp();
  const [editing, setEditing] = useState(!account);
  const [bank, setBank] = useState('');
  const [num, setNum] = useState('');
  const [check, setCheck] = useState(null); // null | 'checking' | 'ok' | 'mismatch'
  const numErr = num && (num.length < 10 || num.length > 14) ? '계좌번호는 10~14자리 숫자예요.' : null;
  const canCheck = bank && num && !numErr;
  const runCheck = () => {
    setCheck('checking');
    setTimeout(() => setCheck(num.endsWith('0000') ? 'mismatch' : 'ok'), 900);
  };
  const save = () => {
    setAccount({ bank, last4: num.slice(-4), holder: maskName(REAL_NAME), at: TODAY });
    toast(account ? '환전 계좌를 바꿨어요.' : '환전 계좌를 등록했어요.');
    go('wallet');
  };
  const reset = () => { setCheck(null); };
  return html`
    <div className="page narrow">
      <button className="back" onClick=${() => go('wallet')}><${Icon} n="back" s=${14} />지갑</button>
      <${Head} title="환전 계좌" lede="환전한 금액을 받을 계좌예요. 회원 본인 명의 계좌만 등록할 수 있어요." />
      ${account && html`
        <section className="panel">
          <div className="acct">
            <span className="acct-bank">${account.bank.slice(0, 2)}</span>
            <div className="row-main"><b>${account.bank} ****${account.last4}</b><span className="fine">예금주 ${account.holder} · ${md(account.at)} 등록</span></div>
            <${Pill} tone="ok">실명 확인 완료<//>
          </div>
          ${!editing && html`<button className="btn" style=${{ alignSelf: 'flex-start' }} onClick=${() => setEditing(true)}>다른 계좌로 변경</button>`}
        </section>`}
      ${editing && html`
        <section className="panel form">
          <h2>${account ? '새 계좌' : '계좌 등록'}</h2>
          <${Field} id="ac-bank" label="은행">
            <select id="ac-bank" className="select" value=${bank} onChange=${e => { setBank(e.target.value); reset(); }}>
              <option value="">은행을 골라 주세요</option>
              ${BANKS.map(b => html`<option key=${b}>${b}</option>`)}
            </select>
          <//>
          <${Field} id="ac-num" label="계좌번호" err=${numErr} hint="- 없이 숫자만 입력해 주세요. 끝자리가 0000이면 실명 불일치 예시가 나와요.">
            <input id="ac-num" className="input num" inputMode="numeric" value=${num} onChange=${e => { setNum(e.target.value.replace(/\D/g, '')); reset(); }} placeholder="예: 12345678901234" />
          <//>
          <${Field} id="ac-holder" label="예금주" hint="회원 실명으로 자동 입력돼요. 실명이 다르면 등록할 수 없어요.">
            <input id="ac-holder" className="input" value=${maskName(REAL_NAME)} readOnly />
          <//>
          ${check === 'ok' && html`<div className="notice"><${Pill} tone="ok">확인됨<//> ${bank} 계좌의 예금주가 회원 실명과 같아요.</div>`}
          ${check === 'mismatch' && html`<div className="notice warn">예금주가 회원 실명과 달라요. 본인 명의 계좌인지 확인해 주세요.</div>`}
          <div className="row-actions" style=${{ justifyContent: 'flex-end' }}>
            ${account && html`<button className="btn ghost" onClick=${() => { setEditing(false); reset(); }}>취소</button>`}
            ${check === 'ok'
              ? html`<button className="btn primary" onClick=${save}>${account ? '이 계좌로 변경' : '이 계좌 등록'}</button>`
              : html`<button className="btn primary" disabled=${!canCheck || check === 'checking'} onClick=${runCheck}>${check === 'checking' ? '확인하는 중…' : '실명 확인'}</button>`}
          </div>
        </section>`}
      <p className="fine">계좌번호는 암호화해서 저장해요. 정산일에는 그때 등록된 계좌로 송금하고, 송금에 실패하면 신청한 HP를 다시 쓸 수 있게 돌려놔요.</p>
    </div>`;
}

/* 강의 등록·수정 페이지: 기본 정보는 바로 반영, 영상·자료(강의 내용)가 바뀌면 재검수 */
const STUDIO_DETAIL = {
  l7: { sub: '픽업·마이크 두 채널로 깔끔하게', intro: '통기타 노래방송에서 픽업과 마이크를 함께 쓰는 세팅을 처음부터 따라 해요.', cat: '세팅', thumb: 0, curr: lecById('l7').curr },
  s2: { sub: '다시보기가 막히지 않는 노래방송', intro: ADMIN_LEC.k1.intro, cat: '성장', thumb: 2, curr: ADMIN_LEC.k1.curr },
  s3: { sub: '야외 방송에서 동선과 음향 챙기기', intro: '버스킹 방송을 할 때 카메라 동선, 바람 소리, 주변 소음을 다루는 방법이에요.', cat: '세팅', thumb: 1, curr: [['장소 고르기', 9], ['카메라 동선', 12], ['바람 소리 줄이기', 8], ['주변 소음과 양해 구하기', 7]], rejectedLesson: 2 },
};
const THUMBS = [['#5B2333', '#F7D9C4'], ['#1D3787', '#FFD84D'], ['#0E6B5C', '#F3F7C6'], ['#111318', '#7CE0C3'], ['#E6E0FF', '#33247F']];
const CATS = ['세팅', '성장', '편집', '컨디션'];
function LectureEditScreen({ sid, demo }) {
  const { studio, setStudio, go, toast } = useApp();
  const s = sid ? studio.find(x => x.id === sid) : null;
  const d = s ? STUDIO_DETAIL[s.id] : null;
  const init = s
    ? { title: s.title, sub: d.sub, intro: d.intro, cat: d.cat, price: String(s.price), thumb: d.thumb, lessons: d.curr.map(([t, m], i) => ({ id: 'ls' + i, t, min: m, video: 'done', ver: 1 })) }
    : { title: '', sub: '', intro: '', cat: '세팅', price: '10000', thumb: 0, lessons: [{ id: 'ls0', t: '', min: 0, video: 'none', ver: 0 }] };
  const [f, setF] = useState(() => {
    if (demo === 'video') return { ...init, lessons: init.lessons.map((l, i) => i === 2 ? { ...l, video: 'done', ver: 2, min: l.min + 2 } : l) };
    return init;
  });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const setLesson = (id, patch) => setF(x => ({ ...x, lessons: x.lessons.map(l => l.id === id ? { ...l, ...patch } : l) }));
  const move = (i, dir) => setF(x => { const ls = [...x.lessons]; const j = i + dir; if (j < 0 || j >= ls.length) return x; [ls[i], ls[j]] = [ls[j], ls[i]]; return { ...x, lessons: ls }; });
  const upload = id => {
    setLesson(id, { video: 'uploading' });
    setTimeout(() => setLesson(id, { video: 'done', min: 8 + Math.floor(Math.random() * 15), ver: 2 }), 1200);
  };
  const p = Number(f.price) || 0;
  const errP = p < 1000 ? '1,000 HP 이상으로 정해 주세요.' : p % 1000 ? '1,000 HP 단위로 정해 주세요. 무료 강의는 없어요.' : null;
  const contentKey = ls => JSON.stringify(ls.map(l => [l.t, l.ver]));
  const contentChanged = s && contentKey(f.lessons) !== contentKey(init.lessons);
  const infoChanged = s && ['title', 'sub', 'intro', 'cat', 'price', 'thumb'].some(k => String(f[k]) !== String(init[k]));
  const ready = f.title.trim() && !errP && f.lessons.length > 0 && f.lessons.every(l => l.t.trim() && l.video === 'done');
  const total = f.lessons.reduce((a, l) => a + (l.min || 0), 0);
  const preview = { title: f.title || '강의 제목', cat: f.cat, curr: f.lessons.map(l => [l.t, l.min]), minutes: total, thumb: THUMBS[f.thumb] };
  const submit = () => {
    if (!s) { setStudio(x => [{ id: uid(), title: f.title, price: p, status: 'review', sold: 0 }, ...x]); toast('검수를 신청했어요. 승인되면 공개돼요.'); }
    else if (contentChanged || s.status === 'rejected') { setStudio(x => x.map(i => i.id === s.id ? { ...i, title: f.title, price: p, status: 'review', reason: null } : i)); toast('저장하고 재검수를 신청했어요.'); }
    else { setStudio(x => x.map(i => i.id === s.id ? { ...i, title: f.title, price: p } : i)); toast('저장했어요. 바로 반영돼요.'); }
    go('studio');
  };
  const label = !s ? '검수 신청' : s.status === 'rejected' ? '수정 후 재검수 신청' : contentChanged ? '저장하고 재검수 신청' : '저장';
  return html`
    <div className="page">
      <button className="back" onClick=${() => go('studio')}><${Icon} n="back" s=${14} />강의 판매</button>
      <${Head} title=${s ? '강의 수정' : '강의 등록'} lede=${s ? s.title : '등록한 강의는 관리자 검수를 통과하면 공개되고 판매가 시작돼요.'} />
      ${s && s.status === 'rejected' && html`<div className="notice warn"><b>반려 사유</b> ${s.reason}</div>`}
      <div className="split">
        <div className="page" style=${{ gap: 16 }}>
          <section className="panel form">
            <div className="panel-head"><h2>기본 정보</h2>${s && html`<${Pill} tone="ok">수정해도 바로 반영<//>`}</div>
            <${Field} id="le-title" label="강의 제목"><input id="le-title" className="input" value=${f.title} onChange=${e => set('title', e.target.value)} placeholder="예: 통기타 라이브 세팅" /><//>
            <${Field} id="le-sub" label="한 줄 소개"><input id="le-sub" className="input" value=${f.sub} onChange=${e => set('sub', e.target.value)} placeholder="목록과 썸네일 아래에 보이는 문장" /><//>
            <${Field} id="le-intro" label="상세 소개" hint="소개와 실제 내용이 다르면 구매자가 30일 안에 이의 제기할 수 있어요."><textarea id="le-intro" className="textarea" value=${f.intro} onChange=${e => set('intro', e.target.value)}></textarea><//>
            <div className="form-row">
              <${Field} id="le-cat" label="카테고리"><select id="le-cat" className="select" value=${f.cat} onChange=${e => set('cat', e.target.value)}>${CATS.map(c => html`<option key=${c}>${c}</option>`)}</select><//>
              <${Field} id="le-price" label="가격 (HP)" err=${errP}><input id="le-price" className="input num" inputMode="numeric" value=${f.price} onChange=${e => set('price', e.target.value.replace(/\D/g, ''))} /><//>
            </div>
            <div className="field">
              <label>썸네일</label>
              <div className="thumb-pick">
                ${THUMBS.map((t, i) => html`<button key=${i} className=${'swatch' + (f.thumb === i ? ' on' : '')} style=${{ background: t[0], color: t[1] }} aria-label=${'썸네일 색 ' + (i + 1)} aria-pressed=${f.thumb === i} onClick=${() => set('thumb', i)}>가</button>`)}
                <label className="upload-mini" htmlFor="le-thumb">이미지 올리기<input id="le-thumb" type="file" accept="image/*" style=${{ display: 'none' }} /></label>
              </div>
            </div>
          </section>
          <section className="panel">
            <div className="panel-head"><h2>강의 내용</h2>${s ? html`<${Pill} tone="warn">수정하면 재검수<//>` : html`<span className="fine num">${f.lessons.length}강 · ${total}분</span>`}</div>
            <div className="lessons">
              ${f.lessons.map((l, i) => html`
                <div key=${l.id} className=${'lesson' + (s && d.rejectedLesson === i ? ' flag' : '')}>
                  <span className="no num">${pad(i + 1)}</span>
                  <div className="lesson-main">
                    <input className="input" aria-label=${`${i + 1}강 제목`} value=${l.t} onChange=${e => setLesson(l.id, { t: e.target.value })} placeholder="강의 제목" />
                    <div className="lesson-meta">
                      ${l.video === 'done' && html`<span className="fine">영상 ${l.min}분${l.ver > 1 && s ? ' · 새 영상으로 교체됨' : ''}</span>`}
                      ${l.video === 'uploading' && html`<span className="fine">올리는 중…</span><span className="progress" style=${{ width: 80 }}><span style=${{ width: '60%' }}></span></span>`}
                      ${l.video === 'none' && html`<span className="fine c-bad">영상이 없어요</span>`}
                      ${s && d.rejectedLesson === i && html`<${Pill} tone="bad">반려 사유 해당<//>`}
                      ${l.ver > 1 && s && html`<${Pill} tone="warn">재검수 대상<//>`}
                    </div>
                  </div>
                  <div className="row-actions">
                    <button className="btn sm" disabled=${l.video === 'uploading'} onClick=${() => upload(l.id)}>${l.video === 'none' ? '영상 올리기' : '영상 교체'}</button>
                    <button className="btn ghost sm" aria-label="위로" disabled=${i === 0} onClick=${() => move(i, -1)}>↑</button>
                    <button className="btn ghost sm" aria-label="아래로" disabled=${i === f.lessons.length - 1} onClick=${() => move(i, 1)}>↓</button>
                    <button className="btn ghost sm" aria-label="삭제" disabled=${f.lessons.length === 1} onClick=${() => setF(x => ({ ...x, lessons: x.lessons.filter(y => y.id !== l.id) }))}>삭제</button>
                  </div>
                </div>`)}
            </div>
            <button className="btn" style=${{ alignSelf: 'flex-start' }} onClick=${() => setF(x => ({ ...x, lessons: [...x.lessons, { id: uid(), t: '', min: 0, video: 'none', ver: 0 }] }))}><${Icon} n="plus" s=${14} />강 추가</button>
            <${Field} id="le-files" label="첨부 자료 (선택)" hint="자료를 바꿔도 재검수 대상이에요."><div className="upload"><input id="le-files" type="file" multiple style=${{ maxWidth: '100%' }} /></div><//>
          </section>
        </div>
        <aside className="panel sticky">
          <${Thumb} l=${preview} />

  // 보류: 수익 HP 먼저, 부족분은 충전 HP. 잔액이 모자라면 null.
  const hold = (amount, desc) => {
    const e = Math.min(amount, wallet.earn), c = amount - e;
    if (c > wallet.charge) { toast('HP가 부족해요. 충전 후 다시 시도해 주세요.'); return null; }
    setWallet(w => ({ ...w, earn: w.earn - e, charge: w.charge - c }));
    addLedger([{ desc, type: '결제', kind: 'charge', amt: -amount }]);
    return { e, c };
  };
  // 보류 해제: back에 적힌 만큼 종류별로 돌려받고, 나머지는 상대방에게 지급

            ${MEMBER.includes(role) && html`

        { id: 'a-member', name: '회원 상세', role: 'admin', screen: { id: 'adminMember', mid: 'M-10231' }, route: '/admin/members/{id}', api: ['GET /api/v1/admin/members/{id}', 'GET /api/v1/wallets/{memberId}'], rules: ['보유·보류 HP, 거래, 신고·이의 제기 이력', '관리자는 HP 종류(충전·수익)까지 확인', '대화하기로 채팅 연결'] },
        { id: 'a-deal', name: '거래 상세', role: 'admin', screen: { id: 'adminDeal', did: 'APP-20261003-0031' }, route: '/admin/deals/{id}', api: ['GET /api/v1/admin/deals/{id}', 'GET /api/v1/wallets/ledger?refId={id}'], rules: ['상태 변화 기록과 원장(HP 이동)을 함께 보여 줌', '이의 제기가 있으면 판단 화면으로 연결'] },
        { id: 'a-log', name: '처리 이력', role: 'admin', screen: { id: 'adminLog' }, route: '/admin/audit-logs', api: ['GET /api/v1/admin/audit-logs?type='], rules: ['승인·반려·판단·답변을 처리자·일시·사유와 함께 기록', '기록은 지우거나 고칠 수 없음 (append-only)'] },
        { id: 'a-reject-template', name: '반려 사유 템플릿', role: 'admin', screen: { id: 'adminChannel', openReject: 'v3' }, route: '/admin/channels', api: ['GET /api/v1/admin/reject-templates?type='], rules: ['심사 종류별 자주 쓰는 사유를 골라 입력', '고른 뒤 문장을 고칠 수 있음', '사유는 사용자에게 그대로 전달되고 이력에 남음'] },
    ] },
    ] },
];
const ALL_FRAMES = [];
PAGES.forEach(p => {
  let n = 0;
  p.groups.forEach(g => g.items.forEach(f => {
    n += 1;
    Object.assign(f, { page: p.id, group: g.group, code: `${p.code}-${pad(n)}`, state: { ...p.state, ...(f.state || {}) } });
    ALL_FRAMES.push(f);
  }));
  p.frames = p.groups.flatMap(g => g.items);
});
const ROLE_SHORT = { guest: '비회원', user: '유저', inf: '인플', vinf: '인증', admin: '관리자' };
const SCREEN_LABEL = { search: '검색 결과', adminMember: '회원 상세', adminDeal: '거래 상세', orders: '주문 내역', orderDone: '주문 완료', inquiry: '문의 상세', withdraw: '회원 탈퇴', chargeResult: '충전 결과', account: '환전 계좌', lectureEdit: '강의 등록·수정', watch: '강의 재생', reviewWrite: '리뷰 쓰기', lecture: '강의 상세', recruit: '모집 상세', profile: '인플루언서 프로필', adminLectureDetail: '강의 검수 상세', adminDisputeDetail: '이의 제기 상세' };
NAV.forEach(g => g.items.forEach(it => { SCREEN_LABEL[it.id] = it.label; }));
const DEVICES = { desktop: { label: 'Desktop', w: 1440, h: 900, thumb: 300 }, mobile: { label: 'Mobile', w: 390, h: 844, thumb: 150 } };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const FrameIcon = ({ modal }) => html`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.3" aria-hidden="true">${modal
  ? html`<rect x="1.5" y="1.5" width="11" height="11" rx="1.5" /><rect x="4" y="4.5" width="6" height="5" rx="1" fill="currentColor" stroke="none" opacity=".55" />`
  : html`<path d="M4.5 1v12M9.5 1v12M1 4.5h12M1 9.5h12" />`}</svg>`;
const ApiLine = ({ s }) => { const i = s.indexOf(' '); return html`<code className="fx-code"><span className="m">${s.slice(0, i)}</span>${s.slice(i + 1)}</code>`; };

function FrameView({ f, device, s, nonce, onScreen }) {
  const D = DEVICES[device];
  const ref = useRef(null);
  return html`
    <div className=${'fx-frame' + (device === 'mobile' ? ' mobile' : '')} style=${{ width: D.w * s, height: D.h * s }}>
      <div className="fx-screen" style=${{ width: D.w, height: D.h, transform: `scale(${s})` }}>
        <div className="fx-scroll" ref=${ref}>
          <${App} key=${f.id + ':' + nonce} frame=${f} scrollRef=${ref} onScreen=${onScreen} />
        </div>
      </div>
    </div>`;
}

function Editor() {
  const initial = (() => {
    const h = location.hash.replace('#', '');
    if (ALL_FRAMES.some(f => f.id === h)) return h;
    const saved = store.get('hapbang-frame-v3');
    return ALL_FRAMES.some(f => f.id === saved) ? saved : 'u-home';
  })();
  const [sel, setSel] = useState(initial);
  const [mode, setMode] = useState(() => store.get('hapbang-mode') === 'all' ? 'all' : 'frame');
  const [device, setDevice] = useState(() => store.get('hapbang-device') === 'mobile' ? 'mobile' : 'desktop');
  const [zoom, setZoom] = useState('fit');
  const [nonce, setNonce] = useState(0);
  const [cur, setCur] = useState(null);
  const [q, setQ] = useState('');
  const [info, setInfo] = useState(false);
  const [cs, setCs] = useState({ w: 1000, h: 700 });
  const canvasRef = useRef(null);

  const f = ALL_FRAMES.find(x => x.id === sel) || ALL_FRAMES[0];
  const page = PAGES.find(p => p.id === f.page);
  const idx = page.frames.indexOf(f);
  const D = DEVICES[device];
  const fit = Math.max(0.2, Math.min((cs.w - 64) / D.w, (cs.h - 96) / D.h, 1));
  const s = zoom === 'fit' ? fit : Number(zoom);
  const moved = cur && cur !== f.screen.id;

  const pick = (id, m) => { setSel(id); setCur(null); store.set('hapbang-frame-v3', id); if (m) { setMode(m); store.set('hapbang-mode', m); } };
  const pickPage = pid => { const p = PAGES.find(x => x.id === pid); pick(p.frames[0].id); };
  const step = d => pick(page.frames[(idx + d + page.frames.length) % page.frames.length].id);
  const reset = () => { setNonce(n => n + 1); setCur(null); };
  const setM = m => { setMode(m); store.set('hapbang-mode', m); };

  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setCs({ w: e.contentRect.width, h: e.contentRect.height }));
    ro.observe(canvasRef.current);
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    const k = e => {
      const t = e.target;
      if (t.closest && (t.closest('.fx-screen') || /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
      if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
      else if (e.key === 'r') reset();
      else if (e.key === 'Enter' && mode === 'all') setM('frame');
      else if (e.key === 'Escape' && mode === 'frame') setM('all');
      else if (['1', '2', '3'].includes(e.key)) pickPage(PAGES[+e.key - 1].id);
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  });

  const ql = q.trim();
  const groups = page.groups.map(g => ({ ...g, items: g.items.filter(it => !ql || it.name.includes(ql) || it.code.includes(ql.toUpperCase())) })).filter(g => g.items.length);
  const role = ROLES.find(r => r.id === f.role).label;

  return html`
    <div className="fx">
      <header className="fx-bar">
        <div className="fx-file"><span className="lg">합방</span><span className="sub">UI 목업</span></div>
        <div className="fx-crumb">${page.label} / ${mode === 'all' ? html`<b>전체 프레임</b>` : html`<span className="num">${f.code}</span> <b>${f.name}</b>`}</div>
        <div className="fx-tools">
          <div className="fx-seg" role="radiogroup" aria-label="보기 방식">
            <button role="radio" aria-checked=${mode === 'frame'} className=${mode === 'frame' ? 'on' : ''} onClick=${() => setM('frame')}>프레임</button>
            <button role="radio" aria-checked=${mode === 'all'} className=${mode === 'all' ? 'on' : ''} onClick=${() => setM('all')}>전체 보기</button>
          </div>
          ${mode === 'frame' && html`
            <button className="fx-btn icon" onClick=${() => step(-1)} aria-label="이전 프레임" title="이전 프레임 (↑)"><${Icon} n="back" s=${14} /></button>
            <span className="fx-note num">${idx + 1}/${page.frames.length}</span>
            <button className="fx-btn icon" onClick=${() => step(1)} aria-label="다음 프레임" title="다음 프레임 (↓)"><span style=${{ display: 'inline-flex', transform: 'scaleX(-1)' }}><${Icon} n="back" s=${14} /></span></button>`}
          <div className="fx-seg" role="radiogroup" aria-label="기기">
            ${Object.entries(DEVICES).map(([k, d]) => html`<button key=${k} role="radio" aria-checked=${device === k} className=${device === k ? 'on' : ''} onClick=${() => { setDevice(k); store.set('hapbang-device', k); }}>${d.label}</button>`)}
          </div>
          ${mode === 'frame' && html`
            <select id="fx-zoom" className="fx-select" value=${zoom} onChange=${e => setZoom(e.target.value)} aria-label="확대">
              <option value="fit">맞춤 (${Math.round(fit * 100)}%)</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option>
            </select>
            <button className="fx-btn" onClick=${reset} title="프레임 초기화 (R)">초기화</button>`}
          <button className="fx-btn fx-info-btn" onClick=${() => setInfo(v => !v)} aria-expanded=${info}>정보</button>
        </div>
        <div className="fx-only-s fx-mselects">
          <select id="fx-page-select" className="fx-select" value=${page.id} onChange=${e => pickPage(e.target.value)} aria-label="역할 페이지">${PAGES.map(p => html`<option key=${p.id} value=${p.id}>${p.label} 기준</option>`)}</select>
          <select id="fx-frame-select" className="fx-select" value=${sel} onChange=${e => pick(e.target.value, 'frame')} aria-label="프레임 선택">
            ${page.groups.map(g => html`<optgroup key=${g.group} label=${g.group}>${g.items.map(it => html`<option key=${it.id} value=${it.id}>${it.code} ${it.name}</option>`)}</optgroup>`)}
          </select>
        </div>
      </header>

      <aside className="fx-layers" aria-label="페이지와 프레임">
        <div className="fx-layers-head">
          <div className="fx-h"><span>페이지</span></div>
          <div className="fx-pages">
            ${PAGES.map((p, i) => html`<button key=${p.id} className=${'fx-page' + (p.id === page.id ? ' on' : '')} onClick=${() => pickPage(p.id)} aria-current=${p.id === page.id ? 'true' : undefined}>
              <span className="pg-code num">${p.code}</span><span className="pg-main"><b>${p.label} 기준</b><span>${p.sub}</span></span><span className="num pg-n">${p.frames.length}</span>
            </button>`)}
          </div>
          <div className="fx-h" style=${{ marginTop: 4 }}><span>프레임</span><span className="num">${page.frames.length}</span></div>
          <input id="fx-search" className="fx-search" value=${q} onChange=${e => setQ(e.target.value)} placeholder="이름이나 번호로 찾기" />
        </div>
        ${groups.map(g => html`
          <div key=${g.group} className="fx-group">
            <h5><span>${g.group}</span><span className="num">${g.items.length}</span></h5>
            ${g.items.map(it => html`
              <button key=${it.id} className=${'fx-item' + (it.id === sel ? ' on' : '')} aria-current=${it.id === sel ? 'true' : undefined} onClick=${() => pick(it.id, 'frame')}>
                <${FrameIcon} modal=${!!it.modal} />
                <span className="code num">${it.code}</span>
                <span className="nm">${it.name}</span>
                ${it.role !== page.id && html`<span className="rl">${ROLE_SHORT[it.role]}</span>`}
              </button>`)}
          </div>`)}
        ${groups.length === 0 && html`<p className="fx-note" style=${{ padding: 16 }}>"${ql}"에 맞는 프레임이 없어요.</p>`}
      </aside>

      <div className="fx-canvas" ref=${canvasRef}>
        ${mode === 'frame' ? html`
          <div className="fx-stage">
            <div className="fx-label" style=${{ width: D.w * s }}>
              <b><span className="num">${f.code}</span> ${f.name}</b>
              <span className="num">${D.label} ${D.w}×${D.h} · ${Math.round(s * 100)}%</span>
            </div>
            <${FrameView} f=${f} device=${device} s=${s} nonce=${nonce} onScreen=${setCur} />
          </div>`
        : html`
          <div className="fx-board">
            <div className="fx-board-head"><h2>${page.label} 기준</h2><p>${page.desc}</p></div>
            ${page.groups.map(g => html`
              <section key=${g.group} className="fx-section">
                <h3>${g.group}<span className="num">${g.items.length}</span></h3>
                <div className="fx-row">
                  ${g.items.map(it => html`
                    <div key=${it.id} className=${'fx-thumb' + (it.id === sel ? ' on' : '')}>
                      <div className="fx-thumb-label" style=${{ width: D.thumb }}><span className="num">${it.code}</span> ${it.name}</div>
                      <div className="fx-thumb-body" inert="">
                        <${FrameView} f=${it} device=${device} s=${D.thumb / D.w} nonce=${0} />
                      </div>
                      <button className="fx-thumb-hit" onClick=${() => pick(it.id, 'frame')} aria-label=${`${it.code} ${it.name} 열기`}></button>
                    </div>`)}
                </div>
              </section>`)}
          </div>`}
      </div>

      <aside className=${'fx-inspect' + (info ? ' open' : '')} aria-label="정보">
        ${mode === 'all' ? html`
          <div className="fx-sec">
            <h6>페이지</h6>
            <div className="fx-title">${page.label} 기준</div>
            <p className="fx-note">${page.desc}</p>
            <dl className="fx-props"><dt>프레임</dt><dd>${page.frames.length}개 · 섹션 ${page.groups.length}개</dd><dt>기준일</dt><dd className="num">${TODAY.replace(/-/g, '.')} (KST)</dd></dl>
          </div>
          <div className="fx-sec">
            <h6>돈의 흐름</h6>
            <div className="fx-flow">${page.flow.map((x, i) => html`<span key=${x}>${i > 0 && html`<i>→</i>`}${x}</span>`)}</div>
          </div>

            <h6>할 수 있는 것</h6>

          </div>
          <div className="fx-sec">
            <h6>할 수 없는 것</h6>
            <ul className="fx-rules muted-list">${page.cannot.map(x => html`<li key=${x}>${x}</li>`)}</ul>
          </div>
          <div className="fx-sec"><p className="fx-note">프레임을 누르면 크게 열려요. <span className="fx-kbd">1</span> <span className="fx-kbd">2</span> <span className="fx-kbd">3</span> 으로 역할 페이지를 바꿔요.</p></div>`
        : html`
          <div className="fx-sec">
            <h6>프레임</h6>

            <dl className="fx-props">
              <dt>페이지</dt><dd>${page.label} 기준 · ${f.group}</dd>
              <dt>역할</dt><dd>${role}</dd>
              <dt>화면</dt><dd>${SCREEN_LABEL[f.screen.id]}${f.modal ? ' + 모달' : ''}</dd>
              <dt>기준일</dt><dd className="num">${TODAY.replace(/-/g, '.')} (KST)</dd>
            </dl>
            ${moved
              ? html`<div className="fx-moved"><span>프레임 안에서 '${SCREEN_LABEL[cur] || cur}'(으)로 이동했어요</span><button className="fx-btn" onClick=${reset}>초기화</button></div>`
              : html`<p className="fx-note">프레임 안을 누르면 실제 앱처럼 동작해요. 바뀐 상태는 초기화로 되돌려요.</p>`}
          </div>
          <div className="fx-sec"><h6>라우트 (안)</h6><code className="fx-code">${f.route}</code></div>

          <div className="fx-sec"><h6>적용 정책</h6><ul className="fx-rules">${f.rules.map(r => html`<li key=${r}>${r}</li>`)}</ul></div>
          <div className="fx-sec"><h6>단축키</h6><p className="fx-note"><span className="fx-kbd">↑</span> <span className="fx-kbd">↓</span> 이전·다음 · <span className="fx-kbd">R</span> 초기화 · <span className="fx-kbd">Esc</span> 전체 보기 · <span className="fx-kbd">1</span>–<span className="fx-kbd">3</span> 역할</p></div>`}
      </aside>
    </div>`;
}

{ const seen = new WeakSet(); [REVIEWS, LEDGER0, LIB0, APPS0, RECRUITS0, ROOMS0, INQ0, ADMIN0, SALES, ALERTS, HISTORY, ADMIN_DISPUTE, LEDGER_USER, ADMIN_ROOMS, INQ_ADMIN, ADMIN_MEMBERS, ADMIN_DEALS, USER_STATE, APPS_NO_DISPUTE, RECRUITS_NO_REQ, PAGES].forEach(o => shiftDeep(o, seen)); }
