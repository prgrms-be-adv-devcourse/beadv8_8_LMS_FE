<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>합방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 앱 셸 — 프로토타입 역할 스트립 / 상단 바 / 왼쪽 내비 레일 / 작업 영역. HP 종류는 색으로 고정(충전=파랑, 수익=초록, 보류=호박색). */
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --sunken:#E8EAEF; --line:#DADDE5; --line-2:#C3C8D3;
  --ink:#14161B; --ink-2:#454B5A; --ink-3:#737A8C;
  --signal:#EE5A24; --signal-ink:#FFFFFF; --signal-soft:#FCE6DC;
  --charge:#2C5FD6; --charge-soft:#E1E9FB;
  --earn:#0A8659; --earn-soft:#DCF1E7;
  --hold:#A0650C; --hold-soft:#F6EAD3;
  --bad:#C0283A; --bad-soft:#FADFE2;
  --shadow:0 1px 2px rgba(20,22,27,.06),0 10px 30px rgba(20,22,27,.08);
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  /* 에디터(피그마식 캔버스) 크롬 */
  --fx-canvas:#E2E4E9; --fx-dot:#C5C9D2; --fx-panel:#FFFFFF; --fx-sunken:#F1F2F5; --fx-line:#E1E3E8; --fx-ink:#1B1D22; --fx-ink-2:#6A7080; --fx-sel:#2F67F6; --fx-sel-soft:#E4ECFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --sunken:#1F232B; --line:#2A2F39; --line-2:#3A404C;
  --ink:#ECEEF3; --ink-2:#B0B6C3; --ink-3:#7F8698;
  --signal:#FF6B3A; --signal-ink:#140A05; --signal-soft:#3A2119;
  --charge:#79A2FF; --charge-soft:#1B2640;
  --earn:#3CCB93; --earn-soft:#12302A;
  --hold:#E3A94F; --hold-soft:#33281A;
  --bad:#FF6F7F; --bad-soft:#3A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --fx-canvas:#1A1B1F; --fx-dot:#2E3138; --fx-panel:#25272C; --fx-sunken:#1E2024; --fx-line:#34373E; --fx-ink:#E8E9ED; --fx-ink-2:#959AA6; --fx-sel:#6B93FF; --fx-sel-soft:#25304B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --sunken:#1F232B; --line:#2A2F39; --line-2:#3A404C;
  --ink:#ECEEF3; --ink-2:#B0B6C3; --ink-3:#7F8698;
  --signal:#FF6B3A; --signal-ink:#140A05; --signal-soft:#3A2119;
  --charge:#79A2FF; --charge-soft:#1B2640;
  --earn:#3CCB93; --earn-soft:#12302A;
  --hold:#E3A94F; --hold-soft:#33281A;
  --bad:#FF6F7F; --bad-soft:#3A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --fx-canvas:#1A1B1F; --fx-dot:#2E3138; --fx-panel:#25272C; --fx-sunken:#1E2024; --fx-line:#34373E; --fx-ink:#E8E9ED; --fx-ink-2:#959AA6; --fx-sel:#6B93FF; --fx-sel-soft:#25304B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.c-charge{color:var(--charge)} .c-earn{color:var(--earn)} .c-hold{color:var(--hold)} .c-bad{color:var(--bad)}

/* 프로토타입 스트립 */
.app-root{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.proto{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;font-size:12px}
.proto b{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:transparent;color:var(--bg);border-radius:999px;padding:3px 10px;font-size:12px}
.seg button.on{background:var(--bg);color:var(--ink);border-color:var(--bg);font-weight:600}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{font-family:var(--f-display);font-size:26px;line-height:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;letter-spacing:-.01em}
.onair{display:inline-flex;align-items:center;gap:4px;font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--signal);border:1.5px solid var(--signal);border-radius:4px;padding:1px 5px 1px 4px}
.onair::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.onair::before{animation:none}}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:999px;padding:7px 14px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hp-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px}
.hp-pill .coin{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 10px var(--f-mono);display:grid;place-items:center}
.hp-pill .num{font-weight:600}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font:600 11px/18px var(--f-mono);padding:0 5px}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me small{display:block;color:var(--ink-3);font-size:11px;line-height:1.2}

/* 셸 */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);flex:1}
.side{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group h4{margin:0 0 4px 10px;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.nav-item{display:flex;align-items:center;justify-content:space-between;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item.on{background:var(--ink);color:var(--surface)}
.nav-item .cnt{font:600 11px var(--f-mono);padding:0 6px;border-radius:9px;background:var(--signal);color:var(--signal-ink)}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 10px}
main{padding:28px 32px 64px;min-width:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

@container app (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px;gap:4px}
  .nav-group{flex-direction:row;gap:4px}
  .nav-group h4,.side-foot{display:none}
  .nav-item{white-space:nowrap;gap:6px}
  main{padding:20px 16px 56px}
  .search{display:none}
  .me span:last-child{display:none}
}

/* 페이지 헤드 */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph-text{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:68ch}
.page-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,36px);line-height:1.1;letter-spacing:-.01em}
.lede{color:var(--ink-2)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink-3);padding:0;font-size:13px;align-self:flex-start}
.back:hover{color:var(--ink)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--ink-2)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.google-btn{gap:10px;padding-block:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* 칩·필 */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill.mute{background:var(--sunken);color:var(--ink-3)}
.pill.info{background:var(--charge-soft);color:var(--charge)}
.pill.ok{background:var(--earn-soft);color:var(--earn)}
.pill.warn{background:var(--hold-soft);color:var(--hold)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.signal{background:var(--signal);color:var(--signal-ink)}
.pill.line{border:1px solid var(--line-2);color:var(--ink-2);background:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.charge{background:var(--charge)} .dot.earn{background:var(--earn)} .dot.hold{background:var(--hold)}

/* 패널·공지 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunken);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
.notice.warn{background:var(--hold-soft);color:var(--hold)}
.fine{font-size:12px;color:var(--ink-3);line-height:1.55}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:12px}

/* 강의 카드 */
.lec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.lec-card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.lec-card:hover .thumb{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--tb);color:var(--tf);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:12px 14px;isolation:isolate;transition:transform .15s,box-shadow .15s}
.thumb::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px)}
.t-cat{position:absolute;top:10px;left:12px;font:600 10px var(--f-mono);letter-spacing:.08em;border:1px solid currentColor;padding:1px 6px;border-radius:4px}
.t-title{font-family:var(--f-display);font-size:22px;line-height:1.15;text-wrap:balance}
.t-sub{font:500 11px var(--f-mono);opacity:.8}
.thumb.big{border-radius:12px;padding:20px 24px}
.thumb.big .t-title{font-size:clamp(28px,4.2vw,44px)}
.thumb.big .t-cat{top:18px;left:22px}
.thumb.sm{width:112px;flex:none;padding:6px 8px;border-radius:6px}
.thumb.sm .t-title{font-size:12px}
.thumb.sm .t-cat,.thumb.sm .t-sub{display:none}
.lec-meta{display:flex;flex-direction:column;gap:2px}
.lec-title{font-weight:700;line-height:1.35}
.lec-seller{font-size:13px;color:var(--ink-3)}
.lec-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.rating{font-size:13px;color:var(--hold);font-weight:600}
.price{font-weight:600}
.lec-flags{display:flex;gap:4px;margin-top:6px}

/* 2단 */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.sticky{position:sticky;top:84px}
.split>.page{margin:0;max-width:none;min-width:0}
.page.narrow{max-width:720px}
.split.watch{grid-template-columns:minmax(0,1fr) 360px}
.progress{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.lesson-mark{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font:600 10px var(--f-mono);color:var(--ink-3);align-self:center}
.lesson-mark.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.lesson-mark.now{border-color:var(--signal);color:var(--signal)}
.stars{display:flex;align-items:center;gap:2px}
.star{border:0;background:none;font-size:34px;line-height:1;padding:0 2px;color:var(--line-2)}
.star.on{color:var(--hold)}
@container app (max-width:960px){.split,.split.watch{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
.seller-row{display:flex;align-items:center;gap:10px}
.curr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.curr li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.curr li:first-child{border-top:0}
.curr .no{font:600 12px var(--f-mono);color:var(--ink-3);width:28px;flex:none}
.curr .t{flex:1;min-width:0}
.review{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.review:first-of-type{border-top:0}
.big-price{font:600 28px var(--f-mono);letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink)}

/* 리스트 행 */
.rows{display:flex;flex-direction:column}
.row-item{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row-item:first-child{border-top:0}
.row-main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.row-title{font-weight:700}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.timeline{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.timeline span{display:inline-flex;align-items:center;gap:6px}
.timeline span+span::before{content:"→";color:var(--line-2)}
.timeline .hit{color:var(--ink);font-weight:600}

/* 결제 내역 */
.breakdown{background:var(--sunken);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.breakdown .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.breakdown .row.sub{font-size:13px;color:var(--ink-2)}
.breakdown .row.short{color:var(--bad);font-weight:600}
.breakdown .total{border-top:1px solid var(--line-2);padding-top:8px}

/* 인플루언서 카드 */
.inf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.inf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.inf-top{display:flex;gap:12px;align-items:center}
.inf-name{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stat{display:flex;flex-direction:column}
.stat b{font:600 15px var(--f-mono)}
.stat span{font-size:11px;color:var(--ink-3)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--ink-2);background:var(--sunken);border-radius:4px;padding:1px 7px}
.inf-actions{display:flex;gap:6px;margin-top:auto}
.inf-actions .btn{flex:1}

/* 모집 */
.rec-list{display:flex;flex-direction:column;gap:12px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;text-align:left;width:100%}
.rec:hover{border-color:var(--ink-3)}
.rec-title{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.rec-fee{text-align:right;display:flex;flex-direction:column;gap:2px}
.rec-fee b{font:600 18px var(--f-mono)}
.rec-fee span{font-size:12px;color:var(--ink-3)}
.seats{display:flex;gap:3px}
.seat{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line-2)}
.seat.on{background:var(--ink);border-color:var(--ink)}
@container app (max-width:560px){.rec{grid-template-columns:minmax(0,1fr)}.rec-fee{text-align:left}}
.appl{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.appl:first-child{border-top:0}
.appl.sel{}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--surface);padding:0}
.appl.off{opacity:.55}
.seg-sm{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg-sm button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;color:var(--ink-2)}
.seg-sm button+button{border-left:1px solid var(--line-2)}
.seg-sm button.on{background:var(--ink);color:var(--surface);font-weight:600}
.check.on{background:var(--ink);border-color:var(--ink)}

/* 출연 카드 */
.app-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.app-card.attn{border-color:color-mix(in srgb,var(--signal) 55%,var(--line))}
.app-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-head .who{flex:1;min-width:160px;display:flex;flex-direction:column}
.app-head .who b{font-size:15px}
.app-head .who span{font-size:12px;color:var(--ink-3)}
.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px}
.cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell span{font-size:12px;color:var(--ink-3)}
.cell b{font-weight:600}
.app-note{font-size:13px;color:var(--ink-2);background:var(--sunken);border-radius:6px;padding:8px 12px}
.app-foot{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stepper{display:flex;list-style:none;margin:0;padding:0}
.stepper li{flex:1;position:relative;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);min-width:0}
.stepper li::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper li.done::before{background:var(--ink)}
.stepper .sd{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);position:relative;z-index:1}
.stepper li.done .sd{background:var(--ink);border-color:var(--ink)}
.stepper li.now .sd{border-color:var(--signal);background:var(--signal-soft)}
.stepper li.now{color:var(--ink);font-weight:600}
.stepper.stopped li.now .sd{border-color:var(--ink-3);background:var(--sunken)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;color:var(--ink-3)}
.sum b{font:600 20px var(--f-mono)}

/* 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font:600 11px var(--f-mono);background:var(--sunken);border-radius:8px;padding:0 6px;color:var(--ink-2)}

/* 지갑 */
.wallet-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@container app (max-width:900px){.wallet-grid{grid-template-columns:minmax(0,1fr)}}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.bal .lbl{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2)}
.bal .amt{font:600 30px var(--f-mono);letter-spacing:-.02em;line-height:1.1}
.bal .amt small{font-size:14px;color:var(--ink-3);margin-left:4px}
.bal .desc{font-size:12px;color:var(--ink-3)}
.bal .acts{display:flex;gap:6px;margin-top:auto}
.hold-lines{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hold-lines div{display:flex;justify-content:space-between}
.settle{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.cal{width:84px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;text-align:center;background:var(--surface)}
.cal div:first-child{background:var(--ink);color:var(--surface);font:600 11px var(--f-mono);padding:3px 0;letter-spacing:.08em}
.cal div:nth-child(2){font:400 34px/1.2 var(--f-display);padding-top:4px}
.cal div:last-child{font-size:12px;color:var(--ink-3);padding-bottom:6px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.amt-p{color:var(--earn);font-weight:600}
.amt-m{color:var(--ink)}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.select.sm{width:auto;padding:5px 10px;font-size:13px}
.textarea{min-height:88px;resize:vertical}
.input.num{text-align:right}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:12px;color:var(--bad);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.amt-chips{display:flex;gap:6px;flex-wrap:wrap}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--hold-soft);color:var(--ink);border-radius:8px;padding:12px 14px}
.consent input{margin-top:4px;accent-color:var(--ink)}
.upload{border:1.5px dashed var(--line-2);border-radius:8px;padding:18px;text-align:center;font-size:13px;color:var(--ink-3)}

/* 모달 */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:500px;max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:640px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h2{font-size:17px;font-weight:700}
.modal header .icon-btn{border:0;width:32px;height:32px}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.penalty{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.penalty div{border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.penalty span{font-size:12px}
.penalty b{font:600 20px var(--f-mono)}

/* 채팅 */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:720px;overflow:hidden}
.rooms{border-right:1px solid var(--line);overflow-y:auto}
.room{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.room.on{background:var(--sunken)}
.room .rm{flex:1;min-width:0}
.room .rm b{display:block;font-size:14px}
.room .rm span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .cnt{font:600 11px/18px var(--f-mono);min-width:18px;height:18px;border-radius:9px;background:var(--signal);color:var(--signal-ink);text-align:center;padding:0 5px}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.thread-head .who{flex:1;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:72%;display:flex;flex-direction:column;gap:2px}
.msg .bubble{padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bubble{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.msg time{font:500 11px var(--f-mono);color:var(--ink-3)}
.sys-card{align-self:center;width:min(320px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.sys-card b{font-size:13px}
.chat-note{margin-top:-12px;text-align:center}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
@container app (max-width:720px){.chat{grid-template-columns:minmax(0,1fr);height:auto}.rooms{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.room{width:auto;flex:none;border-bottom:0;border-right:1px solid var(--line)}.room .rm span{display:none}.msgs{min-height:340px}.msg{max-width:88%}}

/* 관리자 */
.q-item{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.q-item:first-child{border-top:0}
.crit{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.reject-box{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.reject-box .input{flex:1;min-width:180px}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px);animation:up .2s ease-out}
@keyframes up{from{transform:translate(-50%,8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.steps-v{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps-v li{display:flex;gap:12px;align-items:flex-start}
.steps-v .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font:600 12px var(--f-mono);flex:none;color:var(--ink-3)}
.steps-v li.done .n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.steps-v li.now .n{border-color:var(--signal);color:var(--signal)}
/* 홈·알림·프로필·운영 상세 */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cta{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cta h2{font-size:18px}
.cta p{font-size:14px;opacity:.8}
.cta .btn{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.todo{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 0}
.rows .todo:first-child,.panel>.todo:first-of-type{border-top:0}
.todo:hover .todo-main b{text-decoration:underline;text-underline-offset:3px}
.todo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo-main b{font-size:14px}
.sched{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sched:first-child{border-top:0}
.date-b{width:52px;flex:none;border-radius:8px;background:var(--sunken);display:flex;flex-direction:column;align-items:center;padding:4px 0}
.date-b b{font:400 22px/1.1 var(--f-display)}
.date-b span{font-size:11px;color:var(--ink-3)}
.alert-item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:14px 0;font-size:14px}
.alert-item:first-child{border-top:0}
.alert-dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent}
.alert-dot.on{background:var(--signal)}
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.sum-btn{text-align:left;cursor:pointer}
.sum-btn:hover{border-color:var(--ink-3)}
.admin-tag{font:600 11px var(--f-body);background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 6px;letter-spacing:0}
.player{aspect-ratio:16/9;max-width:100%;background:#0B0C0F;color:#F2F3F6;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;font-size:14px}
.player-ico{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.player-time{position:absolute;left:14px;bottom:10px;font-size:12px;opacity:.7}
.chk-row{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.chk-row input{accent-color:var(--ink);width:16px;height:16px}
.claims{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outcome{border:1.5px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:13px}
.outcome b{font-size:14px}
.outcome.on{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
/* 충전 결과·환전 계좌·강의 편집 */
.pg-box{border:1.5px dashed var(--line-2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pg-amt{display:flex;justify-content:space-between;align-items:baseline;width:100%;border-top:1px solid var(--line);padding-top:12px}
.pg-amt b{font-size:24px}
.pg-actions{display:flex;flex-direction:column;gap:8px;width:100%}
.result{align-items:center;text-align:center;padding:32px 24px;gap:12px}
.result h1{font-size:24px;font-weight:700}
.result .breakdown{text-align:left}
.result-ico{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:700}
.result-ico.ok{background:var(--earn-soft);color:var(--earn)}
.result-ico.bad{background:var(--bad-soft);color:var(--bad)}
.result-ico.mute{background:var(--sunken);color:var(--ink-3)}
.result-ico.wait{background:var(--sunken)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.acct{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acct-bank{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.acct-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.thumb-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:44px;height:30px;border-radius:6px;border:2px solid transparent;font-family:var(--f-display);font-size:14px;padding:0}
.swatch.on{outline:2px solid var(--ink);outline-offset:2px}
.upload-mini{border:1.5px dashed var(--line-2);border-radius:6px;padding:5px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
.lessons{display:flex;flex-direction:column}
.lesson{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lesson:first-child{border-top:0}
.lesson.flag{background:var(--bad-soft);margin:0 -12px;padding:12px;border-radius:8px}
.lesson .no{font:600 12px var(--f-mono);color:var(--ink-3);width:24px;flex:none}
.lesson-main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.lesson-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 문의 스레드·탈퇴·프로필 편집 */
.inq-row{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.rows .inq-row:first-child{border-top:0}
.inq-row:hover .row-title{text-decoration:underline;text-underline-offset:3px}
.thread{gap:0;padding:4px 20px}
.tmsg{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tmsg:first-child{border-top:0}
.tmsg-head{display:flex;align-items:center;gap:8px;font-size:13px}
.tmsg p{font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.tmsg.admin{background:var(--sunken);margin:0 -20px;padding:14px 20px}
.tag-x{display:inline-flex;align-items:center;gap:4px}
.tag-x button{border:0;background:none;padding:0 2px;color:var(--ink-3);font-size:14px;line-height:1}
.wd-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.wd-row:first-child{border-top:0}
.wd-mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.wd-mark.ok{background:var(--earn-soft);color:var(--earn)}
.wd-mark.warn{background:var(--hold-soft);color:var(--hold)}
.wd-mark.bad{background:var(--bad-soft);color:var(--bad)}
.wd-mark.info{background:var(--charge-soft);color:var(--charge)}
.plain{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
/* 빈 상태·처리 중 */
.empty-state{align-items:center;text-align:center;padding:48px 24px;gap:10px}
.empty-state b{font-size:16px}
.empty-state p{color:var(--ink-2);font-size:14px;max-width:44ch}
.empty-ico{width:56px;height:56px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;color:var(--ink-3)}
.row-item.off{opacity:.6}
.spinner.sm{width:14px;height:14px;border-width:2px;border-top-color:currentColor;margin-right:6px}
.spinner.xs{width:10px;height:10px;border-width:2px;border-top-color:currentColor;margin-right:4px}
.alert-bar{justify-content:space-between}
.alert-bar span{flex:1;min-width:220px}
/* 반려 사유 템플릿 */
.tpl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.chip.sm{font-size:12px;padding:3px 10px}
/* 모바일 보완 */
.logo{white-space:nowrap}
.m-cta{display:none}
@container app (max-width:960px){
  .m-cta{display:flex;position:sticky;bottom:0;z-index:5;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:var(--shadow)}
  .m-cta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@container app (max-width:720px){
  .chat{height:600px}
  .msgs{min-height:0}
}
@container app (max-width:480px){
  .top{gap:8px;padding-inline:12px}
  .onair{display:none}
  .top-right{gap:6px}
  .hp-pill{padding:4px 10px 4px 4px}
  .icon-btn{width:34px;height:34px}
}
@container app (max-width:560px){
  .tbl.ledger,.tbl.refunds,.tbl.exch{min-width:0}
  .tbl.ledger thead,.tbl.refunds thead,.tbl.exch thead{display:none}
  .tbl.ledger tr,.tbl.refunds tr,.tbl.exch tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .tbl.ledger tr:last-child,.tbl.refunds tr:last-child,.tbl.exch tr:last-child{border-bottom:0}
  .tbl.ledger td,.tbl.refunds td,.tbl.exch td{border:0;padding:0}
  .tbl.ledger td:nth-child(2){grid-column:1;grid-row:1;font-weight:600}
  .tbl.ledger td:nth-child(4){grid-column:2;grid-row:1}
  .tbl.ledger td:nth-child(1){grid-column:1;grid-row:2}
  .tbl.ledger td:nth-child(3){grid-column:2;grid-row:2;text-align:right;color:var(--ink-3);font-size:12px}
  .tbl.refunds td:nth-child(2){grid-column:1;grid-row:1;text-align:left;font-weight:600}
  .tbl.refunds td:nth-child(3){grid-column:2;grid-row:1}
  .tbl.refunds td:nth-child(1){grid-column:1 / -1;grid-row:2;color:var(--ink-3);font-size:12px}
  .tbl.refunds td:nth-child(4){grid-column:1 / -1;grid-row:3}
  .tbl.exch td:nth-child(4){grid-column:1;grid-row:1;text-align:left;font-size:15px}
  .tbl.exch td:nth-child(4)::after{content:"원 송금";font-weight:400;color:var(--ink-3);font-size:12px;margin-left:4px}
  .tbl.exch td:nth-child(6){grid-column:2;grid-row:1}
  .tbl.exch td:nth-child(5){grid-column:1 / -1;grid-row:2;font-size:12px}

function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);
  return html`
    <div className="backdrop" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title}>
        <header><h2>${title}</h2><button className="icon-btn" onClick=${onClose} aria-label="닫기"><${Icon} n="close" /></button></header>
        <div className="modal-body">${children}</div>
        ${footer && html`<footer>${footer}</footer>`}
      </div>
    </div>`;
}

function PayBreakdown({ amount, wallet, label = '결제할 HP' }) {
  const have = wallet.earn + wallet.charge;
  const short = Math.max(0, amount - have);
  return html`

      <div className="row sub"><span>보유 HP</span><span className="num">${fmt(have)}</span></div>
      ${short > 0
        ? html`<div className="row short total"><span>부족한 HP</span><span className="num">${fmt(short)} HP</span></div>`
        : html`<div className="row sub total"><span>결제 후 남는 HP</span><span className="num">${fmt(have - amount)}</span></div>`}
      <p className="fine">결제한 HP는 거래가 끝날 때까지 보류되고, 취소·거절되면 그대로 돌려받아요.</p>

}

function CheckoutModal({ items, onClose }) {
  const { wallet, hold, setLibrary, setCart, toast, go, openModal } = useApp();
  const ls = items.map(lecById).filter(l => !l.reviewing);
  const total = ls.reduce((a, l) => a + l.price, 0);
  const short = Math.max(0, total - Math.min(total, wallet.earn) - wallet.charge);
  const [busy, setBusy] = useState(false);
  const pay = () => { setBusy(true); setTimeout(payNow, 900); };
  const payNow = () => {
    const desc = ls.length > 1 ? `강의 주문 · ${ls[0].title} 외 ${ls.length - 1}개` : `강의 구매 · ${ls[0].title}`;
    const split = hold(total, desc);
    if (!split) return;
    let re = split.e;
    const oid = `ORD-${TODAY.replace(/-/g, '')}-` + String(40 + (++_id % 50)).padStart(4, '0');
    const rows = ls.map(l => { const e = Math.min(re, l.price); re -= e; return { id: uid(), order: oid, lec: l.id, at: TODAY, state: 'before', e, c: l.price - e }; });
    setLibrary(b => [...rows, ...b]);
    setCart(cs => cs.filter(x => !ls.some(l => l.id === x)));
    onClose(); go('orderDone', { order: oid });
  };
  return html`
    <${Modal} title="주문 확인" onClose=${onClose} footer=${html`
      <button className="btn ghost" onClick=${onClose}>닫기</button>
      ${short > 0
        ? html`<button className="btn primary" onClick=${() => openModal('charge', { preset: Math.ceil(short / 1000) * 1000 })}>${fmt(Math.ceil(short / 1000) * 1000)} HP 충전하기</button>`
        : html`<button className="btn primary" disabled=${busy} onClick=${pay}>${busy ? html`<span className="spinner sm"></span>결제하는 중…` : `${fmt(total)} HP 결제`}</button>`}`}>
      <div className="rows">
        ${ls.map(l => html`<div key=${l.id} className="row-item" style=${{ padding: '10px 0' }}><div className="row-main"><span className="row-title">${l.title}</span><span className="fine">${l.seller}</span></div><span className="num">${fmt(l.price)} HP</span></div>`)}
      </div>
      <${PayBreakdown} amount=${total} wallet=${wallet} />
    <//>`;
}

    if (!a.selected && sel.length >= r.seats) { toast(`모집 인원 ${r.seats}명까지 선정할 수 있어요.`); return; }
    patchApplicant(id, { selected: !a.selected });
  };
  const establish = () => {
    patchRec({ status: 'established' });
    setApps(a => [...sel.map(p => ({ id: uid(), side: 'host', type: '모집', recruit: r.title, partner: p.name, fee: r.fee, airAt: r.airAt, status: 'established', split: { e: 0, c: r.fee } })), ...a]);
    if (rest > 0) unhold(rest, { e: 0, c: rest }, `모집 성립 · 미선정 ${r.seats - sel.length}자리 반환`);
    setConfirm(null); toast(`모집이 성립됐어요. ${fmt(rest)} HP를 돌려받았어요.`); go('appearances');
  };
  // 정책 5: 성립 전 모집 취소 시 선정된 게스트마다 1인 출연료의 30%를 위약금으로 제함.
  // 취소 요청을 보낸 게스트는 팝업에서 요청을 수락하면 위약금 대상에서 빠짐.
  const penalized = sel.filter(p => !p.cancelReq || decide[p.id] === 'reject');
  const penalty = penalized.length * pen1;
  const total = r.fee * r.seats;
  const undecided = pendingReq.some(p => !decide[p.id]);
  const cancelAll = () => {
    unhold(total, { e: 0, c: total - penalty }, `모집 취소 · ${r.title}`);
    patchRec({ status: 'cancelled' });
    setConfirm(null);
    toast(penalty ? `모집을 취소했어요. 위약금 ${fmt(penalty)} HP를 빼고 ${fmt(total - penalty)} HP를 돌려받았어요.` : `모집을 취소하고 ${fmt(total)} HP를 돌려받았어요.`);
  };
  const my = r.my || null;
  return html`
    <div className="page">
      <button className="back" onClick=${() => go('recruits')}><${Icon} n="back" s=${14} />출연 모집</button>
      <div className="split">
        <div className="page" style=${{ gap: 16 }}>
          <div style=${{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style=${{ display: 'flex', gap: 6 }}><${Pill} tone="line">${r.cat}<//>${r.status === 'open' ? html`<${Pill} tone="warn">모집 중 · D-${dday(r.deadline)}<//>` : r.status === 'established' ? html`<${Pill} tone="ok">성립<//>` : r.status === 'expired' ? html`<${Pill}>자동 취소 · 전액 반환<//>` : html`<${Pill}>취소됨<//>`}</div>
            <h1 style=${{ fontSize: 26, fontWeight: 700 }}>${r.title}</h1>
            <p className="lede">${r.desc}</p>
            ${r.status === 'expired' && r.mine && html`<div className="notice">${mdw(r.deadline)}까지 모집을 성립시키지 않아 자동 취소됐어요. 보류했던 <b className="num">${fmt(r.fee * r.seats)} HP</b>를 모두 돌려받았어요.</div>`}
          </div>
          ${r.mine ? html`
            <section className="panel">
              <div className="panel-head"><h2>지원자 ${r.applicants.length}명</h2><span className="fine">선정 ${sel.length} / ${r.seats}명</span></div>
              <div>
                ${r.applicants.map(p => html`
                  <div key=${p.id} className=${'appl' + (p.withdrawn ? ' off' : '')}>
                    <button className=${'check' + (p.selected && !p.withdrawn ? ' on' : '')} aria-pressed=${!!p.selected} aria-label=${p.name + ' 선정'} disabled=${r.status !== 'open' || p.withdrawn || !!p.cancelReq} onClick=${() => toggle(p.id)}>${p.selected && !p.withdrawn && html`<${Icon} n="check" s=${14} />`}</button>
                    <${Avatar} name=${p.name} size=${32} />
                    <div style=${{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
                      <div><b style=${{ fontSize: 14 }}>${p.name}</b>
                        ${p.withdrawn ? html` <${Pill}>취소 요청 승인 · 선정 제외<//>` : p.cancelReq ? html` <${Pill} tone="warn">출연 취소 요청<//>` : p.selected ? html` <${Pill} tone="ok">선정<//>` : null}</div>
                      <p style=${{ fontSize: 14, color: 'var(--ink-2)' }}>${p.msg}</p>
                      ${p.cancelReq && html`<div className="app-note">
                        <span>취소 사유: "${p.cancelReq}"</span>
                        <span className="fine" style=${{ display: 'block' }}>승인하면 선정에서 빠지고 모집은 계속돼요. 거절하면 선정이 유지돼요. 성립 전이라 어느 쪽이든 위약금은 없어요.</span>
                        <div className="row-actions" style=${{ marginTop: 8 }}>
                          <button className="btn sm" onClick=${() => { patchApplicant(p.id, { cancelReq: null }); toast('취소 요청을 거절했어요. 선정이 유지돼요.'); }}>요청 거절</button>
                          <button className="btn primary sm" onClick=${() => { patchApplicant(p.id, { cancelReq: null, selected: false, withdrawn: true }); toast(`${p.name} 님을 선정에서 뺐어요. 모집은 계속돼요.`); }}>요청 승인</button>
                        </div>
                      </div>`}
                    </div>
                    <button className="btn ghost sm" onClick=${() => go('chat', { with: p.name })}>채팅</button>
                  </div>`)}
              </div>
              <p className="fine">성립 전에는 선정을 위약금 없이 취소할 수 있어요.</p>
            </section>`
          : html`
            <section className="panel">
              <div className="seller-row"><${Avatar} name=${r.host} /><div><b>${r.host}</b><div className="fine">호스트</div></div></div>
              ${!INF.includes(role) ? html`<div className="notice">출연 지원은 채널 인증을 마친 인플루언서만 할 수 있어요.</div>`
              : my === 'applied' ? html`
                <div className="notice"><${Pill} tone="info">지원 완료<//> 호스트가 선정하면 알림으로 알려 드려요.</div>
                <button className="btn sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => { patchRec({ my: null }); toast('지원을 철회했어요.'); }}>지원 철회</button>
                <p className="fine">선정되기 전에는 언제든 지원을 철회할 수 있어요.</p>`
              : my === 'selected' ? html`
                <div className="notice"><${Pill} tone="ok">선정됨<//> 호스트가 ${mdw(r.deadline)}까지 모집을 성립시키면 출연이 확정돼요.</div>
                ${asking ? html`
                  <${Field} id="rc-why" label="출연 취소 사유" hint="호스트에게 그대로 전달돼요."><textarea id="rc-why" className="textarea" value=${why} onChange=${e => setWhy(e.target.value)}></textarea><//>
                  <div className="row-actions"><button className="btn ghost sm" onClick=${() => setAsking(false)}>닫기</button><button className="btn primary sm" disabled=${!why.trim()} onClick=${() => { patchRec({ my: 'cancelReq' }); setAsking(false); toast('호스트에게 출연 취소를 요청했어요.'); }}>취소 요청 보내기</button></div>`
                : html`<button className="btn sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => setAsking(true)}>출연 취소 요청</button>`}
                <p className="fine">성립 전 취소는 위약금이 없어요. 호스트가 승인하면 선정에서 빠져요.</p>`
              : my === 'cancelReq' ? html`
                <div className="notice warn"><${Pill} tone="warn">취소 요청 보냄<//> 호스트가 승인하면 선정에서 빠져요. 거절하면 선정이 유지돼요.</div>`
              : html`<${Field} id="ap-msg" label="지원 메시지"><textarea id="ap-msg" className="textarea" value=${msg} onChange=${e => setMsg(e.target.value)} placeholder="가능한 시간, 준비할 수 있는 것"></textarea><//>
                  <button className="btn primary" style=${{ alignSelf: 'flex-start' }} disabled=${!msg.trim()} onClick=${() => { patchRec({ my: 'applied' }); toast('지원했어요.'); }}>지원하기</button>`}
            </section>`}
        </div>
        <aside className="panel sticky">
          <dl className="kv">
            <dt>1인 출연료</dt><dd className="num">${fmt(r.fee)} HP</dd>
            <dt>모집 인원</dt><dd>${r.seats}명</dd>
            <dt>모집 마감</dt><dd>${mdw(r.deadline)} 23:59</dd>
            <dt>방송 예정</dt><dd>${when(r.airAt)}</dd>
          </dl>
          ${r.mine && r.status === 'open' && html`
            <div className="breakdown">
              <div className="row sub"><span><i className="dot hold"></i>보류 중</span><span className="num">${fmt(total)}</span></div>
              <div className="row sub"><span>선정 ${sel.length}명 × ${fmt(r.fee)}</span><span className="num">${fmt(sel.length * r.fee)}</span></div>
              <div className="row total"><span>성립 시 돌려받는 HP</span><b className="num">${fmt(rest)}</b></div>
            </div>
            ${pendingReq.length > 0 && html`<div className="notice warn">출연 취소 요청 ${pendingReq.length}건에 먼저 답해야 모집을 성립할 수 있어요.</div>`}
            <button className="btn primary block" disabled=${sel.length === 0 || pendingReq.length > 0} onClick=${() => setConfirm('est')}>${sel.length}명으로 모집 성립</button>
            <button className="btn danger block" onClick=${() => setConfirm('cancel')}>모집 취소</button>
            <p className="fine">${mdw(r.deadline)}까지 성립시키지 않으면 모집이 자동 취소되고 보류 HP를 모두 돌려받아요.</p>`}
        </aside>
      </div>
      ${confirm === 'est' && html`<${Modal} title="모집을 성립할까요?" onClose=${() => setConfirm(null)} footer=${html`<button className="btn ghost" onClick=${() => setConfirm(null)}>닫기</button><button className="btn primary" onClick=${establish}>모집 성립</button>`}>
        <p>${sel.map(p => p.name).join(', ')} 님과 출연이 성립되고 모집이 바로 닫혀요. 선정하지 않은 ${r.seats - sel.length}자리분 <b className="num">${fmt(rest)} HP</b>를 돌려받아요.</p>
        <p className="fine">성립 후 호스트가 게스트를 취소하면 1인 출연료의 30%(${fmt(pen1)} HP)를 위약금으로 지급해요.</p>
      <//>`}
      ${confirm === 'cancel' && html`<${Modal} title="모집을 취소할까요?" onClose=${() => setConfirm(null)} footer=${html`<button className="btn ghost" onClick=${() => setConfirm(null)}>닫기</button><button className="btn danger" disabled=${undecided} onClick=${cancelAll}>${penalty ? `위약금 ${fmt(penalty)} HP 내고 취소` : '모집 취소'}</button>`}>
        ${sel.length === 0 ? html`<p>선정한 게스트가 없어 위약금 없이 보류된 <b className="num">${fmt(total)} HP</b>를 모두 돌려받아요.</p>` : html`
          <p>이미 선정한 게스트가 있어서 게스트마다 1인 출연료의 30%(<span className="num">${fmt(pen1)}</span> HP)를 위약금으로 지급해요.</p>
          ${pendingReq.length > 0 && html`<div className="notice warn">출연 취소를 요청한 게스트가 있어요. 요청을 수락하면 그 게스트에게는 위약금이 나가지 않아요.</div>`}
          <div className="rows">
            ${sel.map(p => html`<div key=${p.id} className="row-item" style=${{ padding: '10px 0' }}>
              <${Avatar} name=${p.name} size=${28} />
              <div className="row-main" style=${{ minWidth: 120 }}><b style=${{ fontSize: 14 }}>${p.name}</b>${p.cancelReq && html`<span className="fine">취소 요청: "${p.cancelReq}"</span>`}</div>
              ${p.cancelReq && html`<div className="seg-sm" role="radiogroup" aria-label=${p.name + ' 취소 요청'}>
                <button role="radio" aria-checked=${decide[p.id] === 'accept'} className=${decide[p.id] === 'accept' ? 'on' : ''} onClick=${() => setDecide(d => ({ ...d, [p.id]: 'accept' }))}>요청 수락</button>
                <button role="radio" aria-checked=${decide[p.id] === 'reject'} className=${decide[p.id] === 'reject' ? 'on' : ''} onClick=${() => setDecide(d => ({ ...d, [p.id]: 'reject' }))}>요청 거절</button>
              </div>`}
              <span className="num" style=${{ minWidth: 64, textAlign: 'right' }}>${p.cancelReq && !decide[p.id] ? '−' : penalized.includes(p) ? fmt(pen1) : '0'}</span>
            </div>`)}
          </div>
          <div className="breakdown">
            <div className="row sub"><span>보류 중</span><span className="num">${fmt(total)}</span></div>
            <div className="row sub"><span>위약금 ${penalized.length}명 × ${fmt(pen1)}</span><span className="num">−${fmt(penalty)}</span></div>
            <div className="row total"><span>돌려받는 HP</span><b className="num">${fmt(total - penalty)}</b></div>
          </div>
          ${undecided && html`<p className="err">취소 요청을 수락할지 거절할지 골라 주세요.</p>`}`}
        <p className="fine">지원자 모두에게 모집 취소 알림이 가요.</p>
      <//>`}
    </div>`;
}

function RecruitNewModal({ onClose }) {
  const { wallet, hold, setRecruits, toast, go, openModal } = useApp();
  const [f, setF] = useState({ title: '', fee: '20000', seats: '2', deadline: addDays(TODAY, 10), air: addDays(TODAY, 13) + 'T21:00', desc: '' });
  const set = k => e => setF(s => ({ ...s, [k]: k === 'fee' || k === 'seats' ? e.target.value.replace(/\D/g, '') : e.target.value }));
  const fee = Number(f.fee) || 0, seats = Number(f.seats) || 0, total = fee * seats;
  const errs = {
    title: !f.title.trim() ? '제목을 입력해 주세요.' : null,
    fee: fee < 20000 ? '1인 최저 출연료는 20,000 HP예요.' : null,
    seats: seats < 1 ? '1명 이상 모집해야 해요.' : null,
    deadline: f.deadline < TODAY ? '마감 기한은 오늘 이후여야 해요.' : f.deadline >= f.air.slice(0, 10) ? '마감 기한은 방송 예정일 전으로 정해 주세요.' : null,
  };
  const bad = Object.values(errs).some(Boolean);
  const short = Math.max(0, total - wallet.earn - wallet.charge);
  const submit = () => {
    if (!hold(total, `출연 모집 · ${f.title}`)) return;
    setRecruits(rs => [{ id: uid(), title: f.title, host: ME, mine: true, fee, seats, deadline: f.deadline, airAt: f.air.replace('T', ' '), cat: '게임', status: 'open', desc: f.desc || '모집 내용이 없어요.', applicants: [] }, ...rs]);
    onClose(); toast('모집 글을 올렸어요.'); go('recruits');
  };
  return html`
    <${Modal} title="모집 글 올리기" onClose=${onClose} footer=${html`
      <button className="btn ghost" onClick=${onClose}>취소</button>
      ${short > 0 ? html`<button className="btn primary" onClick=${() => openModal('charge', { preset: Math.ceil(short / 1000) * 1000 })}>HP 충전하기</button>`
        : html`<button className="btn primary" disabled=${bad} onClick=${submit}>${fmt(total)} HP 보류하고 게시</button>`}`}>
      <div className="form">
        <${Field} id="rn-title" label="제목" err=${f.title && errs.title}><input id="rn-title" className="input" value=${f.title} onChange=${set('title')} placeholder="예: 금요일 밤 노래 릴레이 3인" /><//>
        <div className="form-row">
          <${Field} id="rn-fee" label="1인 출연료 (HP)" err=${errs.fee}><input id="rn-fee" className="input num" inputMode="numeric" value=${f.fee} onChange=${set('fee')} /><//>
          <${Field} id="rn-seats" label="모집 인원" err=${errs.seats}><input id="rn-seats" className="input num" inputMode="numeric" value=${f.seats} onChange=${set('seats')} /><//>
        </div>
        <div className="form-row">
          <${Field} id="rn-dl" label="모집 마감 기한" err=${errs.deadline}><input id="rn-dl" type="date" className="input" value=${f.deadline} onChange=${set('deadline')} /><//>
          <${Field} id="rn-air" label="방송 예정 일시"><input id="rn-air" type="datetime-local" className="input" value=${f.air} onChange=${set('air')} /><//>
        </div>
        <${Field} id="rn-desc" label="모집 내용"><textarea id="rn-desc" className="textarea" value=${f.desc} onChange=${set('desc')} placeholder="방송 주제, 진행 방식, 필요한 장비"></textarea><//>
      </div>
      <${PayBreakdown} amount=${total} wallet=${wallet} label=${`보류할 HP (${fmt(fee)} × ${seats}명)`} />
    <//>`;
}

/* ───────── 화면: 내 출연 ───────── */
const STEPS = ['요청·지원', '출연 성립', '방송', '출연 확인·지급'];
const stepOf = s => ({ pending: 0, established: 1, aired: 2, paid: 4 })[s] ?? 0;
const ENDED = { cancelled: '요청 취소 · HP 반환', refused: '거절됨 · HP 반환', agreed: '합의 취소 · HP 반환', penalty: '호스트 취소 · 위약금 지급', expired: '수락 기한 만료 · HP 반환' };

function AppearanceCard({ a }) {
  const { setApps, unhold, openModal, toast, go } = useApp();
  const upd = patch => setApps(x => x.map(i => i.id === a.id ? { ...i, ...patch } : i));
  const host = a.side === 'host';
  const ended = ENDED[a.status];
  const airDay = a.airAt.slice(0, 10);
  const disputeEnd = addDays(airDay, 7), noshowEnd = addDays(airDay, 3);
  let pill, note, actions = [], attn = false;
  if (ended) {
    pill = html`<${Pill}>${ended}<//>`;
    if (a.status === 'expired') note = host ? `${mdw(a.acceptBy)}까지 게스트가 수락하지 않아 보류했던 ${fmt(a.fee)} HP를 돌려받았어요.` : `${mdw(a.acceptBy)}까지 응답하지 않아 요청이 만료됐어요.`;
  }
  else if (a.status === 'pending') {
    pill = host ? html`<${Pill} tone="warn">수락 대기<//>` : html`<${Pill} tone="signal">응답 필요<//>`;
    attn = !host;
    note = host ? `${mdw(a.acceptBy)}까지 수락하지 않으면 보류된 HP를 돌려받아요.` : `${mdw(a.acceptBy)}까지 수락하지 않으면 요청이 만료돼요.`;
    actions = host
      ? [html`<button key="c" className="btn danger sm" onClick=${() => { unhold(a.fee, a.split || { e: 0, c: a.fee }, `출연 요청 취소 · ${a.partner}`); upd({ status: 'cancelled' }); toast(`${fmt(a.fee)} HP를 돌려받았어요.`); }}>요청 취소</button>`]
      : [html`<button key="r" className="btn sm" onClick=${() => { upd({ status: 'refused' }); toast('요청을 거절했어요. 호스트에게 HP가 반환돼요.'); }}>거절</button>`,
         html`<button key="a" className="btn primary sm" onClick=${() => { upd({ status: 'established' }); toast('출연이 성립됐어요.'); }}>수락</button>`];
  } else if (a.status === 'established') {
    if (host && a.cancelReq) {
      attn = true;
      pill = html`<${Pill} tone="warn">취소 요청 받음<//>`;
      note = `게스트 메시지: "${a.cancelReq}" 승인하면 위약금 없이 ${fmt(a.fee)} HP를 돌려받아요. 거절하거나 방송 전까지 응답하지 않으면 출연이 유지돼요.`;
      actions = [html`<button key="rj" className="btn sm" onClick=${() => { upd({ cancelReq: null, reqRejected: true }); toast('취소 요청을 거절했어요. 출연이 유지돼요.'); }}>요청 거절</button>`,
                 html`<button key="ok" className="btn primary sm" onClick=${() => { unhold(a.fee, a.split || { e: 0, c: a.fee }, `합의 취소 · ${a.partner}`); upd({ status: 'agreed' }); toast(`합의 취소했어요. ${fmt(a.fee)} HP를 돌려받았어요.`); }}>취소 승인</button>`];
    } else if (!host && a.myReq) {
      pill = html`<${Pill} tone="warn">취소 요청 보냄<//>`;
      note = '호스트가 승인하면 위약금 없이 취소돼요. 응답이 없으면 출연이 유지돼요.';
    } else {
      pill = html`<${Pill} tone="info">출연 성립<//>`;
      note = host ? '방송 예정일 전에 호스트가 취소하면 출연료의 30%가 게스트에게 위약금으로 지급돼요.' : '방송 예정일 전에 호스트에게 출연 취소를 요청할 수 있어요.';
      actions = host
        ? [html`<button key="hc" className="btn danger sm" onClick=${() => openModal('hostCancel', { a })}>출연 취소</button>`, html`<button key="ch" className="btn sm" onClick=${() => go('chat', { with: a.partner })}>채팅</button>`]
        : [html`<button key="gr" className="btn sm" onClick=${() => openModal('guestCancel', { a })}>출연 취소 요청</button>`, html`<button key="ch" className="btn sm" onClick=${() => go('chat', { with: a.partner })}>채팅</button>`];
    }
  } else if (a.status === 'aired' && a.dispute) {
    pill = html`<${Pill} tone="warn">${a.dispute.kind} 접수 · 지급 중단<//>`;
    note = host
      ? `${md(a.dispute.at)}에 접수했어요. 관리자가 판단할 때까지 출연료 지급이 멈추고 보류가 유지돼요. 인정되면 ${fmt(a.fee)} HP를 돌려받고, 기각되면 게스트에게 지급돼요.`
      : `호스트가 ${a.dispute.kind}를 접수해서 관리자 판단 전까지 지급이 멈췄어요. 고객센터나 운영팀 채팅으로 소명할 수 있어요.`;
    actions = [html`<button key="sp" className="btn sm" onClick=${() => go('support')}>접수 내역 보기</button>`];
  } else if (a.status === 'aired') {
    attn = host;
    pill = host ? html`<${Pill} tone="warn">출연 확인 필요<//>` : html`<${Pill} tone="warn">확인 대기<//>`;
    note = host
      ? `확인하면 게스트에게 출연료가 지급돼요. ${mdw(disputeEnd)}까지 확인하지 않으면 ${mdw(addDays(disputeEnd, 1))}에 자동 확인돼요. 노쇼 신고는 ${mdw(noshowEnd)}까지.`
      : `호스트가 확인하거나 ${mdw(addDays(disputeEnd, 1))}에 자동 확인되면 출연료가 지급돼요.`;
    if (host) actions = [
      ...(TODAY <= noshowEnd ? [html`<button key="ns" className="btn ghost sm" onClick=${() => go('support', { preset: { type: '노쇼 신고', target: a.id } })}>노쇼 신고</button>`] : []),
      html`<button key="cf" className="btn primary sm" onClick=${() => { unhold(a.fee, { e: 0, c: 0 }, `출연료 지급 · ${a.partner}`); upd({ status: 'paid' }); toast(`출연을 확인했어요. ${a.partner}에게 ${fmt(a.fee)} HP가 지급돼요.`); }}>출연 확인</button>`];
  } else if (a.status === 'paid') {
    pill = html`<${Pill} tone="ok">지급 완료<//>`;
    note = host ? '게스트에게 출연료가 지급됐어요.' : `출연료 ${fmt(a.fee)} HP가 지급됐어요. 지갑에서 환전 신청할 수 있어요.`;
    if (!host) actions = [html`<button key="w" className="btn sm" onClick=${() => go('wallet')}>지갑으로</button>`];
  }
  const at = ended ? (a.status === 'penalty' ? 1 : 0) : stepOf(a.status);
  return html`
    <article className=${'app-card' + (attn ? ' attn' : '')}>
      <div className="app-head">
        <${Avatar} name=${a.partner} size=${40} />
        <div className="who"><b>${a.partner}</b><span>${a.type === '요청' ? '출연 요청' : `출연 모집 · ${a.recruit}`} · ${host ? '내가 호스트' : '내가 게스트'}</span></div>
        ${pill}
      </div>
      <div className="app-grid">
        <div className="cell"><span>출연료</span><b className="num">${fmt(a.fee)} HP</b></div>
        <div className="cell"><span>방송 예정</span><b>${when(a.airAt)}</b></div>
        ${a.status === 'pending' && html`<div className="cell"><span>수락 기한</span><b>${mdw(a.acceptBy)} · D-${dday(a.acceptBy)}</b></div>`}
        ${a.status === 'aired' && html`<div className="cell"><span>이의 제기 기간</span><b>${md(addDays(airDay, 1))} ~ ${md(disputeEnd)}</b></div>`}
        ${a.status === 'penalty' && html`<div className="cell"><span>위약금</span><b className="num">${fmt(a.fee * 0.3)} HP</b></div>`}
      </div>
      ${!ended && html`<${Stepper} steps=${STEPS} at=${at} />`}
      ${note && html`<p className="app-note">${note}</p>`}
      ${actions.length > 0 && html`<div className="app-foot">${actions}</div>`}
    </article>`;
}

function AppearancesScreen({ tab: initTab }) {
  const { apps, go, openModal } = useApp();

  const live = list.filter(a => !ENDED[a.status]);
  const done = list.filter(a => ENDED[a.status]);
  const sum = s => apps.filter(a => a.side === tab && s(a)).reduce((x, a) => x + a.fee, 0);
  const needs = s => apps.filter(a => a.side === s && ((s === 'guest' && a.status === 'pending') || (s === 'host' && ((a.status === 'aired' && !a.dispute) || a.cancelReq) && !ENDED[a.status]))).length;
  return html`
    <div className="page">
      <${Head} title="내 출연" lede="호스트로 보낸 요청과 게스트로 받은 출연을 함께 관리해요. 출연료는 방송 예정일 이후 출연 확인 때 지급돼요.">
        <button className="btn" onClick=${() => go('influencers')}>게스트 찾기</button>
        <button className="btn" onClick=${() => go('recruits')}>모집 보기</button>
      <//>
      <${Tabs} value=${tab} onChange=${setTab} tabs=${[{ id: 'host', label: '호스트로', n: needs('host') || null }, { id: 'guest', label: '게스트로', n: needs('guest') || null }]} />
      <div className="summary">
        ${tab === 'host' ? html`
          <div className="sum"><span><i className="dot hold"></i>보류 중 출연료</span><b>${fmt(sum(a => ['pending', 'established', 'aired'].includes(a.status)))}</b></div>
          <div className="sum"><span>확인 필요</span><b>${apps.filter(a => a.side === 'host' && a.status === 'aired' && !a.dispute).length}건</b></div>
          <div className="sum"><span>이번 달 지급한 출연료</span><b>${fmt(sum(a => a.status === 'paid' || a.status === 'penalty'))}</b></div>`
        : html`
          <div className="sum"><span>응답 필요</span><b>${apps.filter(a => a.side === 'guest' && a.status === 'pending').length}건</b></div>
          <div className="sum"><span><i className="dot hold"></i>지급 예정</span><b>${fmt(sum(a => ['established', 'aired'].includes(a.status)))}</b></div>
          <div className="sum"><span><i className="dot earn"></i>지급받은 출연료</span><b>${fmt(sum(a => a.status === 'paid'))}</b></div>`}
      </div>
      <div className="page" style=${{ gap: 12 }}>
        ${live.length === 0 && (tab === 'host'
          ? html`<${Empty} icon="send" title=${done.length ? '진행 중인 출연이 없어요' : '아직 보낸 출연 요청이 없어요'} text="인플루언서를 찾아 출연을 요청하거나, 모집 글을 올려 게스트를 모아 보세요."><button className="btn" onClick=${() => go('influencers')}>게스트 찾기</button><button className="btn primary" onClick=${() => openModal('recruitNew')}>모집 글 올리기</button><//>`
          : html`<${Empty} icon="send" title=${done.length ? '진행 중인 출연이 없어요' : '아직 받은 출연 요청이 없어요'} text="프로필을 채워 두면 호스트가 찾기 쉬워요. 열린 모집 글에 지원해 볼 수도 있어요."><button className="btn" onClick=${() => go('profileEdit')}>내 프로필</button><button className="btn primary" onClick=${() => go('recruits')}>모집 보기</button><//>`)}
        ${live.map(a => html`<${AppearanceCard} key=${a.id} a=${a} />`)}
      </div>
      ${done.length > 0 && html`<h2 style=${{ fontSize: 15, color: 'var(--ink-3)' }}>끝난 출연</h2><div className="page" style=${{ gap: 12 }}>${done.map(a => html`<${AppearanceCard} key=${a.id} a=${a} />`)}</div>`}
    </div>`;
}

function ChatScreen({ with: withName }) {
  const { rooms, setRooms, openModal, role } = useApp();
  const initial = rooms.find(r => r.with === withName)?.id || rooms[0]?.id;
  const [cur, setCur] = useState(initial);
  const [text, setText] = useState('');
  const endRef = useRef(null);
  useEffect(() => {
    if (withName && !rooms.find(r => r.with === withName)) {
      const id = uid();
      setRooms(rs => [{ id, with: withName, unread: 0, msgs: [] }, ...rs]);
      setCur(id);
    }
  }, [withName]);
  useEffect(() => { setRooms(rs => rs.map(r => r.id === cur ? { ...r, unread: 0 } : r)); }, [cur]);
  useEffect(() => { const box = endRef.current?.parentElement; if (box) box.scrollTop = box.scrollHeight; }, [cur, rooms]);
  const room = rooms.find(r => r.id === cur);
  const send = e => {
    e.preventDefault();
    if (!text.trim()) return;
    const d = new Date();
    setRooms(rs => rs.map(r => r.id === cur ? { ...r, msgs: [...r.msgs, { id: uid(), me: true, t: `${pad(d.getHours())}:${pad(d.getMinutes())}`, text }] } : r));
    setText('');
  };
  const guest = room && INFLUENCERS.find(i => i.name === room.with);
  return html`
    <div className="page">
      <div className="chat">
        <nav className="rooms" aria-label="대화 목록">
          ${rooms.map(r => html`<button key=${r.id} className=${'room' + (r.id === cur ? ' on' : '')} onClick=${() => setCur(r.id)}>
            <${Avatar} name=${r.with} size=${36} />
            <span className="rm"><b>${r.with}</b><span>${r.msgs.length ? (r.msgs[r.msgs.length - 1].text || r.msgs[r.msgs.length - 1].card?.title) : '새 대화'}</span></span>
            ${r.unread > 0 && html`<span className="cnt">${r.unread}</span>`}
          </button>`)}
        </nav>
        ${room && html`
        <div className="thread">
          <div className="thread-head">
            <${Avatar} name=${room.with} size=${32} />
            <div className="who"><b>${room.with}</b><div className="fine">${guest ? `${guest.cat} · 희망 출연료 ${fmt(guest.fee)} HP~` : '인플루언서'}</div></div>
            ${guest && INF.includes(role) && html`<button className="btn primary sm" onClick=${() => openModal('request', { guest })}>출연 요청 보내기</button>`}
          </div>
          <div className="msgs">
            ${room.msgs.length === 0 && html`<p className="fine" style=${{ textAlign: 'center', marginTop: 40 }}>${room.with} 님과 대화를 시작해 보세요.</p>`}
            ${room.msgs.map(m => m.sys ? html`
              <div key=${m.id} className="sys-card">
                <b>${m.card.title}</b>
                <dl className="kv"><dt>출연료</dt><dd className="num">${fmt(m.card.fee)} HP</dd><dt>방송</dt><dd>${when(m.card.airAt)}</dd><dt>수락 기한</dt><dd>${mdw(m.card.acceptBy)}</dd></dl>
              </div>` : html`
              <div key=${m.id} className=${'msg' + (m.me ? ' me' : '')}><div className="bubble">${m.text}</div><time>${m.t}</time></div>`)}
            <div ref=${endRef}></div>
          </div>
          <form className="composer" onSubmit=${send}>
            <input id="chat-input" className="input" value=${text} onChange=${e => setText(e.target.value)} placeholder="메시지 입력" aria-label="메시지" autoComplete="off" />
            <button className="btn primary" type="submit" aria-label="보내기"><${Icon} n="send" s=${16} /></button>
          </form>
        </div>`}
      </div>
      <p className="fine chat-note">${role === 'admin' ? '대화 기록은 판단 근거로 보관돼요.' : '대화 기록은 분쟁 확인용으로 보관돼요.'}</p>
    </div>`;
}

function SupportScreen({ preset }) {
  const { apps, setApps, library, inquiries, setInquiries, toast, go } = useApp();
  const TYPES = {
    '노쇼 신고': { hint: '방송 예정일 다음 날부터 3일 안에 신고할 수 있어요. 접수되면 해당 출연료 지급이 멈추고 보류가 유지돼요.', targets: apps.filter(a => a.side === 'host' && a.status === 'aired' && !a.dispute && TODAY <= addDays(a.airAt.slice(0, 10), 3)).map(a => [a.id, `${a.partner} · ${when(a.airAt)} 방송`]) },
    '강의 내용 다름': { hint: '구매일 다음 날부터 30일 안에 접수할 수 있어요. 접수되면 판매자 지급이 멈추고, 관리자 판단에 따라 반환 또는 지급돼요.', targets: library.filter(b => b.state !== 'cancelled' && TODAY <= addDays(b.at, 30)).map(b => [b.id, `${lecById(b.lec).title} · ${md(b.at)} 구매`]) },
    '출연 이의 제기': { hint: '방송 예정일 다음 날부터 7일 안에 접수할 수 있어요.', targets: apps.filter(a => a.status === 'aired' && !a.dispute).map(a => [a.id, `${a.partner} · ${when(a.airAt)} 방송`]) },
    '서비스 불만': { hint: '불편했던 점을 자세히 적어 주세요.', targets: [] },
    '기타': { hint: '', targets: [] },
  };
  const [type, setType] = useState(preset?.type || '노쇼 신고');
  const [target, setTarget] = useState(preset?.target || '');
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const t = TYPES[type];
  const tg = target && t.targets.find(x => x[0] === target) ? target : (t.targets[0]?.[0] || '');

  const submit = e => {
    e.preventDefault();
    const isDeal = needTarget && tg;
    setInquiries(q => [{ id: uid(), type, title: title || type, at: md(TODAY), status: isDeal ? '처리 중' : '답변 대기', target: tg && t.targets.find(x => x[0] === tg)[1], body }, ...q]);
    if (isDeal && type !== '강의 내용 다름') setApps(xs => xs.map(a => a.id === tg ? { ...a, dispute: { kind: type, at: TODAY } } : a));
    setTitle(''); setBody('');
    toast(needTarget ? '접수했어요. 처리 결과가 나올 때까지 해당 건의 지급이 멈춰요.' : '문의를 접수했어요.');
  };
  return html`
    <div className="page">
      <${Head} title="고객센터" lede="노쇼 신고, 강의 내용 다름 이의 제기, 서비스 문의를 받아요. 관리자가 확인한 뒤 답변해요." />
      <div className="split">
        <form className="panel form" onSubmit=${submit}>
          <h2>새 문의</h2>
          <${Field} id="sp-type" label="문의 유형" hint=${t.hint}>
            <select id="sp-type" className="select" value=${type} onChange=${e => { setType(e.target.value); setTarget(''); }}>${Object.keys(TYPES).map(k => html`<option key=${k}>${k}</option>`)}</select>
          <//>
          ${needTarget && (t.targets.length ? html`
            <${Field} id="sp-target" label="대상 거래"><select id="sp-target" className="select" value=${tg} onChange=${e => setTarget(e.target.value)}>${t.targets.map(([id, l]) => html`<option key=${id} value=${id}>${l}</option>`)}</select><//>`
            : html`<div className="notice warn">지금 접수할 수 있는 거래가 없어요. 신고 기한이 지났는지 확인해 주세요.</div>`)}
          <${Field} id="sp-title" label="제목"><input id="sp-title" className="input" value=${title} onChange=${e => setTitle(e.target.value)} /><//>
          <${Field} id="sp-body" label="내용"><textarea id="sp-body" className="textarea" value=${body} onChange=${e => setBody(e.target.value)} placeholder="언제, 무슨 일이 있었는지 적어 주세요. 채팅 기록은 관리자가 함께 확인해요."></textarea><//>
          <button className="btn primary" type="submit" style=${{ alignSelf: 'flex-start' }} disabled=${!body.trim() || (needTarget && !tg)}>접수하기</button>
        </form>
        <aside className="panel">
          <h2>내 문의</h2>
          <div className="rows">
            ${inquiries.map(q => html`<button key=${q.id} className="row-item inq-row" onClick=${() => go('inquiry', { q: q.id })}>
              <span className="row-main">
                <span style=${{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}><${Pill} tone="line">${q.type}<//><span className="fine">${q.at}</span></span>
                <span className="row-title">${q.title}</span>
                ${q.target && html`<span className="fine">${q.target}</span>`}
                <span className="fine">메시지 ${threadOf(q).length}개</span>
              </span>
              ${q.status === '답변 완료' ? html`<${Pill} tone="ok">답변 완료<//>` : html`<${Pill} tone="warn">${q.status}<//>`}
            </button>`)}
          </div>
        </aside>
      </div>
    </div>`;
}
